<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖層檢查 · Inochi2D Demo</title>
<style>
  :root { --bg: #f7efe8; --bg2: #efd9dc; --card: rgba(255,255,255,.86); --ink: #2d2436; --muted: #6f6479;
          --accent: #8a6fd1; --line: rgba(60,40,80,.14); --warn: #d9480f; --c1: #e8590c; --c2: #1971c2; --c3: #c2255c; --c4: #2b8a3e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1826; --bg2: #2c2034; --card: rgba(34,27,45,.9); --ink: #efe8f6;
      --muted: #b3a8c2; --accent: #b39cf5; --line: rgba(255,255,255,.12); }
  }
  :root[data-theme="dark"] { --bg: #1d1826; --bg2: #2c2034; --card: rgba(34,27,45,.9); --ink: #efe8f6;
      --muted: #b3a8c2; --accent: #b39cf5; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; color: var(--ink);
         background: radial-gradient(120% 90% at 20% 10%, var(--bg) 0%, var(--bg2) 100%) fixed;
         font: 14px/1.5 system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  header { flex: none; padding: 16px 16px 0; }
  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  nav.tabs a { text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .lead { color: var(--muted); margin: 0 0 10px; font-size: 13px; }
  .models { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .models button, .bar button, .bar select { font: inherit; font-size: 13px; color: var(--ink); background: var(--card);
      border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .models button[aria-pressed="true"], .bar button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 12px; padding: 0 16px 16px; flex: 1; min-height: 0; }
  @media (max-width: 760px) { body { height: auto; min-height: 100vh; } .wrap { grid-template-columns: 1fr; flex: none; } .sidebar .list { max-height: 32vh; flex: auto; } .main .stage { height: 65vh; flex: none; } }
  .sidebar { display: flex; flex-direction: column; min-height: 0; gap: 6px; }
  .sidebar .list { flex: 1; }
  button:disabled { opacity: .45; cursor: default; }
  #modelSearch { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; margin-bottom: 6px; width: min(100%, 360px); }
  .models { max-height: 110px; overflow: auto; }
  .main { min-width: 0; }
  .tools input[type="color"] { width: 34px; height: 28px; padding: 2px; }
  .tools label { display: inline-flex; gap: 4px; align-items: center; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: auto; padding: 6px; }
  .grp { color: var(--muted); font-size: 12px; margin: 8px 6px 2px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 8px; cursor: pointer; }
  .row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .row.sel { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .row img { width: 34px; height: 34px; object-fit: contain; background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 10px 10px; border-radius: 4px; flex: none; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .hid { color: var(--muted); font-size: 11px; }
  .badge { font-size: 11px; color: #fff; background: var(--warn); border-radius: 999px; padding: 0 6px; }
  .main { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .stage { position: relative; flex: 1; min-height: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  .info { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; max-height: 26vh; overflow: auto; }
  .info b { font-weight: 600; }
  .sus { display: inline-flex; align-items: center; gap: 4px; margin: 2px 6px 2px 0; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; }
  .sus i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend { color: var(--muted); font-size: 12px; }
  /* 原圖顯示 (2026-10-27): each layer beside the GPT part image it came from */
  .row img.src { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }
  .listhead { display: flex; gap: 6px; padding: 2px 6px 4px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .listhead span { width: 34px; text-align: center; flex: none; }
  .cmp { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .cmp figure { margin: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  .cmp img { max-height: 200px; max-width: 280px; object-fit: contain; border-radius: 6px; border: 1px solid var(--line);
             background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 12px 12px; }
</style>
<style>/* (2026-10-30 user: 頁籤好醜) one tidy pill row: never squeezed into a vertical column, scrolls sideways */
nav.tabs { display: flex !important; flex-wrap: nowrap !important; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none !important; white-space: nowrap !important; }
</style>
</head>
<body>
<header>
  <nav class="tabs"><a href="gallery.html">作品集</a><a href="official.html">精緻展示作品</a><a href="layers.html" aria-current="page">圖層檢查</a><a href="voice/">角色聲音</a><a href="model3d.html">3D 模型</a><a href="secret.html">🔒 專屬區</a></nav>
  <h1>拆圖整合圖・單圖層疑點檢查</h1>
  <p class="lead">每個角色的圖層放在靜止位置。左邊點一層就能單獨看它（連被上層蓋住、平常看不到的部分），紅框是自動找到的疑點：碎塊、藏線（被上層蓋住的墨線，上層一動就露出來）、破洞、灰邊。拖曳平移、滾輪縮放、雙擊回正。</p>
  <span class="legend">專屬角色請先到 <a href="secret.html">專屬區解鎖</a>，再返回此頁。</span><br>
  <div class="bar" id="categories" aria-label="角色分類" style="margin: 6px 0"></div>
  <div class="legend" id="categoryStatus" role="status"></div>
  <input id="modelSearch" type="search" placeholder="搜尋角色名稱或版本…" aria-label="搜尋角色">
  <div class="models" id="models"></div>
</header>
<div class="wrap">
  <div class="sidebar"><div class="bar"><button id="selectAll" title="勾選目前清單列出的圖層">全選</button><button id="selectNone" title="隱藏所有圖層">全取消</button><button id="resetVisibility">還原預設</button></div><div class="list" id="list"></div></div>
  <div class="main">
    <div class="bar">
      <button data-mode="all" aria-pressed="true">全部合成</button>
      <button data-mode="solo">只看此層</button>
      <button data-mode="focus">此層＋其他淡化</button>
      <button data-mode="under">此層被蓋住的部分</button>
      <button id="onlySus">只列有疑點的圖層</button>
      <button id="showHidden">顯示表情／姿勢層</button>
      <span class="legend">疑點：<span style="color:var(--c1)">■</span>碎塊 <span style="color:var(--c2)">■</span>藏線 <span style="color:var(--c3)">■</span>破洞 <span style="color:var(--c4)">■</span>灰邊</span>
    </div>
    <div class="bar tools" aria-label="畫面標記工具">
      <button data-tool="pan" aria-pressed="true">拖曳平移</button>
      <button data-tool="rect" aria-pressed="false">框選標記</button>
      <button data-tool="pen" aria-pressed="false">畫筆</button>
      <label>顏色 <input id="ink" type="color" value="#ff2424"></label>
      <label>粗細 <select id="stroke"><option value="2">細</option><option value="4" selected>中</option><option value="8">粗</option></select></label>
      <button id="undo" disabled>復原標記</button><button id="clearMarks" disabled>清除標記</button>
      <button id="suspects" aria-pressed="true">疑點框</button><button id="resetView">畫面回正</button>
      <button id="saveImage" disabled>儲存畫面 PNG</button>
      <span class="legend" id="saveStatus" role="status">框選與畫筆只做標記；儲存含目前縮放、圖層與標記。</span>
    </div>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
    <div class="info" id="info">載入中…</div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const COL = { '碎塊': '#e8590c', '藏線': '#1971c2', '破洞': '#c2255c', '灰邊': '#2b8a3e' };
const TIP = { '碎塊': '和圖層主體分開的小塊，圖層一動就會飄在半空', '藏線': '靜止時被上層蓋住的墨線，上層（瀏海、眼鏡、臉）一動就露出來變殘影',
              '破洞': '圖層內部半透明的洞，底下的東西會透出來', '灰邊': '邊緣還帶著原圖的灰底色 #808080' };
let M = null, imgs = [], sel = -1, mode = 'all', onlySus = false, showHidden = false, vis = [];
let view = { x: 0, y: 0, s: 1 }, fitS = 1;
const cv = $('cv'), ctx = cv.getContext('2d');
let tool = 'pan', marks = [], activeMark = null, showSuspects = true, loadToken = 0;
const marksByModel = new Map(), allowedModels = new Set();
const CATEGORIES = { story: '故事角色', refined: '精緻角色', lab: '卡洛特實驗室', private: '專屬區' };
let category = 'story', categoryUnlocked = false;
function filterModels() {
  const term = $('modelSearch').value.trim().toLowerCase();
  let count = 0;
  for (const b of $('models').children) {
    b.hidden = b.dataset.category !== category || !`${b.textContent} ${b.dataset.id}`.toLowerCase().includes(term);
    if (!b.hidden) count++;
  }
  for (const b of $('categories').children) b.setAttribute('aria-pressed', String(b.dataset.category === category));
  $('categoryStatus').textContent = category === 'private' && !categoryUnlocked
    ? '請先到專屬區解鎖，再返回此頁查看專屬角色。'
    : count ? `${CATEGORIES[category]}・${count} 個版本` : '此分類沒有符合搜尋的角色，請更換關鍵字。';
}
$('modelSearch').oninput = filterModels;
const qs = new URLSearchParams(location.search);

async function loadModels() {
  const featured = ['mr_carrot_sci', 'mr_carrot_mage', 'carol_v3', 'aka', 'midori'];
  const raw = await (await fetch('layers/models.json', { cache: 'no-store' })).json();
  const list = raw.filter(m => m.category !== 'refined' || featured.includes(m.id));
  list.sort((a, b) => (featured.indexOf(a.id) + 1 || 99) - (featured.indexOf(b.id) + 1 || 99));
  let unlocked = false;
  try {
    const pass = sessionStorage.getItem('inochi_secret_pass');
    if (pass) {
      const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('c4rrot_s3cr3t_2026' + pass));
      unlocked = Array.from(new Uint8Array(bytes), b => b.toString(16).padStart(2, '0')).join('') === 'd8ce1e9556765092f2fd4e16118ec0d6acb8ee2f439b1f015483d545054ec510';
    }
  } catch {}
  categoryUnlocked = unlocked;
  for (const [key, label] of Object.entries(CATEGORIES)) {
    const b = document.createElement('button'); b.dataset.category = key;
    b.textContent = `${label}（${list.filter(m => m.category === key).length}）`;
    b.onclick = () => { category = key; filterModels(); };
    $('categories').appendChild(b);
  }
  const available = list.filter(m => !m.private || unlocked);
  const box = $('models');
  for (const m of available) {
    allowedModels.add(m.id);
    const b = document.createElement('button');
    b.textContent = m.name; b.title = `${m.id} ${m.build}`;
    b.onclick = () => { history.replaceState(null, '', `?model=${m.id}`); open(m.id); };
    b.dataset.category = m.category; b.dataset.id = m.id; box.appendChild(b);
  }
  const requested = qs.get('model');
  const initial = available.find(m => m.id === requested) || available.find(m => m.category === category) || available[0];
  if (initial) { category = initial.category; filterModels(); open(initial.id); }
  else filterModels();
}

async function open(id) {
  if (!allowedModels.has(id)) return;
  const token = ++loadToken;
  if (M) marksByModel.set(M.id, marks);
  M = null; imgs = []; marks = []; activeMark = null; drag = null;
  $('saveImage').disabled = true; $('list').replaceChildren(); syncMarks();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  for (const b of $('models').children) b.setAttribute('aria-pressed', String(b.dataset.id === id));
  $('info').textContent = '載入中…';
  try {
    const response = await fetch(`layers/${id}/index.json`, { cache: 'no-store' });
    if (!response.ok) throw new Error('找不到圖層資料');
    const model = await response.json();
    const images = await Promise.all(model.layers.map((L) => new Promise((ok, fail) => {
      const im = new Image(); im.onload = () => ok(im); im.onerror = () => fail(new Error('圖層圖片載入失敗'));
      im.src = `layers/${id}/${L.file}?v=${model.build}`;
    })));
    if (token !== loadToken) return;
    M = model; imgs = images; marks = marksByModel.get(id) || []; syncMarks(); vis = M.layers.map((L) => !L.hidden);
    sel = -1; setMode('all'); fit(); buildList(); draw(); showInfo(); $('saveImage').disabled = false;
  } catch (err) { if (token === loadToken) $('info').textContent = `載入失敗：${err.message}，請重新選擇角色。`; }
}
function listed(L) { return (!onlySus || L.suspects.length) && (!L.hidden || showHidden || (onlySus && L.suspects.length)); }
function changeVisibility(action) {
  if (!M) return;
  vis = M.layers.map((L, i) => action === 'none' ? false : action === 'reset' ? !L.hidden : listed(L) ? true : vis[i]);
  sel = -1; setMode('all'); buildList(); draw(); showInfo();
}
$('selectAll').onclick = () => changeVisibility('all');
$('selectNone').onclick = () => changeVisibility('none');
$('resetVisibility').onclick = () => changeVisibility('reset');

function buildList() {
  const box = $('list'); box.innerHTML = '';
  if (!M) return;
  let g = null;
  const order = M.layers.map((L, i) => i).reverse();           // front first, like a PSD
  if (M.layers.some((L) => L.src)) {
    const h = document.createElement('div'); h.className = 'listhead';
    h.innerHTML = '<span></span><span>圖層</span><span>原圖</span><span style="width:auto;text-align:left">（左：模型裡的圖層，右：GPT 部件原圖）</span>';
    box.appendChild(h);
  }
  for (const i of order) {
    const L = M.layers[i];
    if (onlySus && !L.suspects.length) continue;
    if (L.hidden && !showHidden && !(onlySus && L.suspects.length)) continue;
    if (L.group !== g) { g = L.group; const d = document.createElement('div'); d.className = 'grp'; d.textContent = g || '（根）'; box.appendChild(d); }
    const r = document.createElement('div'); r.className = 'row' + (i === sel ? ' sel' : '');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = vis[i]; cb.title = '顯示／隱藏';
    cb.setAttribute('aria-label', `顯示 ${L.name}`);
    cb.onclick = (e) => { e.stopPropagation(); vis[i] = cb.checked; draw(); };
    const im = document.createElement('img'); im.src = imgs[i] ? imgs[i].src : ''; im.alt = '';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = L.name;
    r.append(cb, im);
    if (L.src) { const s2 = document.createElement('img'); s2.className = 'src'; s2.alt = ''; s2.title = `原圖：${L.srcName}`;
      s2.src = `layers/${M.id}/${L.src}?v=${M.build}`; r.append(s2); }
    r.append(nm);
    if (L.hidden) { const h = document.createElement('span'); h.className = 'hid'; h.textContent = '表情／姿勢'; r.append(h); }
    if (L.backing) { const h = document.createElement('span'); h.className = 'hid'; h.textContent = '墊底層'; r.append(h); }
    if (L.suspects.length) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = L.suspects.length; r.append(b); }
    r.onclick = () => { sel = i; if (mode === 'all') setMode('focus'); buildList(); draw(); showInfo(); };
    box.appendChild(r);
  }
}

function showInfo() {
  const box = $('info');
  if (!M) return;
  const tot = {};
  for (const L of M.layers) for (const s of L.suspects) tot[s.type] = (tot[s.type] || 0) + 1;
  const previewNote = ['aka', 'midori'].includes(M.id) ? '・官方圖層以一般混合模式預覽（最長邊 1600px）；完整混合效果請看精緻展示作品' : '';
  const head = `<b>${M.name}</b>（${M.id}，${M.build}）・${M.layers.length} 層・疑點 ` +
    (Object.keys(tot).length ? Object.entries(tot).map(([k, v]) => `${k} ${v}`).join('、') : '無') + previewNote;
  if (sel < 0) { box.innerHTML = head + '<br>點左邊的圖層查看它的疑點。'; return; }
  const L = M.layers[sel];
  let h = `${head}<br><b>${L.name}</b>　${L.w}×${L.h}　位置 (${L.x}, ${L.y})　深度 ${L.z}${L.hidden ? '　（靜止時隱藏：表情／姿勢層）' : ''}<br>`;
  if (!L.suspects.length) h += '這一層沒有找到疑點。';
  L.suspects.forEach((s, k) => { h += `<span class="sus" data-k="${k}" title="${TIP[s.type]}"><i style="background:${COL[s.type]}"></i>${s.type} ${s.n}px</span>`; });
  if (L.src) h += `<div class="cmp"><figure><img src="${imgs[sel].src}" alt="">模型裡的圖層</figure>` +
    `<figure><img src="layers/${M.id}/${L.src}?v=${M.build}" alt="">原圖顯示：GPT 部件圖 ${L.srcName}</figure></div>`;
  box.innerHTML = h;
  for (const el of box.querySelectorAll('.sus')) el.onclick = () => zoomTo(L.suspects[+el.dataset.k].box);
}

function setMode(m) { mode = m; for (const b of document.querySelectorAll('[data-mode]')) b.setAttribute('aria-pressed', String(b.dataset.mode === m)); }
for (const b of document.querySelectorAll('[data-mode]')) b.onclick = () => { setMode(b.dataset.mode); draw(); };
$('onlySus').onclick = () => { onlySus = !onlySus; $('onlySus').setAttribute('aria-pressed', String(onlySus)); buildList(); };
$('showHidden').onclick = () => { showHidden = !showHidden; $('showHidden').setAttribute('aria-pressed', String(showHidden)); buildList(); };

function fit() {
  const r = $('stage').getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  if (!M) return;
  fitS = Math.min(cv.width / (M.W * 1.04), cv.height / (M.H * 1.04));
  view = { s: fitS, x: (cv.width - M.W * fitS) / 2, y: (cv.height - M.H * fitS) / 2 };
}
function zoomTo(b) {
  const s = Math.min(cv.width / (b[2] * 3), cv.height / (b[3] * 3), fitS * 12);
  view = { s, x: cv.width / 2 - (b[0] + b[2] / 2) * s, y: cv.height / 2 - (b[1] + b[3] / 2) * s };
  draw();
}

function checker() {
  const s = 12, c = document.createElement('canvas'); c.width = c.height = s * 2;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, s * 2, s * 2); g.fillStyle = '#ddd'; g.fillRect(0, 0, s, s); g.fillRect(s, s, s, s);
  return ctx.createPattern(c, 'repeat');
}
let pat = null;
function draw() {
  if (!M) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  pat = pat || checker();
  ctx.setTransform(view.s, 0, 0, view.s, view.x, view.y);
  ctx.fillStyle = mode === 'solo' || mode === 'under' ? pat : 'rgba(236,232,240,1)';
  ctx.fillRect(0, 0, M.W, M.H);
  ctx.imageSmoothingEnabled = view.s < 2;
  if (mode === 'under' && sel >= 0) {
    // the selected layer where something above covers it: drawn alone, then the layers above cut out what they cover
    const off = document.createElement('canvas'); off.width = M.W; off.height = M.H;
    const g = off.getContext('2d'); const L = M.layers[sel];
    if (vis[sel] && imgs[sel]) g.drawImage(imgs[sel], L.x, L.y, L.w, L.h);
    g.globalCompositeOperation = 'destination-in';
    const cov = document.createElement('canvas'); cov.width = M.W; cov.height = M.H; const h = cov.getContext('2d');
    M.layers.forEach((U, i) => { if (i > sel && vis[i] && imgs[i]) h.drawImage(imgs[i], U.x, U.y, U.w, U.h); });
    g.drawImage(cov, 0, 0);
    ctx.globalAlpha = 0.18; drawLayers(() => true); ctx.globalAlpha = 1;
    ctx.drawImage(off, 0, 0);
  } else if (mode === 'solo' && sel >= 0) {
    const L = M.layers[sel]; if (vis[sel] && imgs[sel]) ctx.drawImage(imgs[sel], L.x, L.y, L.w, L.h);
  } else if (mode === 'focus' && sel >= 0) {
    ctx.globalAlpha = 0.22; drawLayers((i) => i !== sel); ctx.globalAlpha = 1;
    const L = M.layers[sel]; if (vis[sel] && imgs[sel]) ctx.drawImage(imgs[sel], L.x, L.y, L.w, L.h);
  } else {
    drawLayers(() => true);
  }
  // suspects: the selected layer's, or every visible layer's in 全部合成
  const show = sel >= 0 && mode !== 'all' ? (vis[sel] ? [sel] : []) : M.layers.map((L, i) => i).filter((i) => vis[i]);
  ctx.lineWidth = 2 / view.s;
  if (showSuspects) for (const i of show) for (const s of M.layers[i].suspects) {
    ctx.strokeStyle = COL[s.type]; ctx.strokeRect(s.box[0], s.box[1], s.box[2], s.box[3]);
  }
  if (showSuspects && sel >= 0 && vis[sel]) { const L = M.layers[sel]; ctx.setLineDash([6 / view.s, 4 / view.s]); ctx.strokeStyle = 'rgba(138,111,209,.9)'; ctx.strokeRect(L.x, L.y, L.w, L.h); ctx.setLineDash([]); }
  drawMarks();
}
function drawLayers(ok) {
  M.layers.forEach((L, i) => { if (vis[i] && ok(i) && imgs[i]) ctx.drawImage(imgs[i], L.x, L.y, L.w, L.h); });
}

function syncMarks() {
  $('undo').disabled = $('clearMarks').disabled = !marks.length;
}
function drawMarks() {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const m of [...marks, ...(activeMark ? [activeMark] : [])]) {
    ctx.strokeStyle = ctx.fillStyle = m.color; ctx.lineWidth = m.width;
    const [p, q] = [m.points[0], m.points[m.points.length - 1]];
    if (m.type === 'rect') ctx.strokeRect(p.x, p.y, q.x - p.x, q.y - p.y);
    else if (m.points.length === 1) { ctx.beginPath(); ctx.arc(p.x, p.y, m.width / 2, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(p.x, p.y); for (const v of m.points.slice(1)) ctx.lineTo(v.x, v.y); ctx.stroke(); }
  }
  ctx.restore();
}
for (const b of document.querySelectorAll('[data-tool]')) b.onclick = () => {
  tool = b.dataset.tool;
  for (const v of document.querySelectorAll('[data-tool]')) v.setAttribute('aria-pressed', String(v === b));
  cv.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
};
$('undo').onclick = () => { marks.pop(); syncMarks(); draw(); };
$('clearMarks').onclick = () => { marks = []; syncMarks(); draw(); };
$('suspects').onclick = () => { showSuspects = !showSuspects; $('suspects').setAttribute('aria-pressed', String(showSuspects)); draw(); };
$('resetView').onclick = () => { fit(); draw(); };
$('saveImage').onclick = () => {
  if (!M) return;
  draw();
  const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
  const g = out.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, out.width, out.height); g.drawImage(cv, 0, 0);
  const filename = `${M.id}_${mode}_${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
  out.toBlob((blob) => {
    if (!blob) { $('saveStatus').textContent = '儲存失敗，請再試一次。'; return; }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(url), 60000);
    $('saveStatus').textContent = '已下載 PNG，可直接提供給 AI 查看。';
  }, 'image/png');
};
// Annotation points use model coordinates so they stay attached when panning or zooming.
let drag = null;
function point(e) {
  const r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * cv.width / r.width - view.x) / view.s,
           y: ((e.clientY - r.top) * cv.height / r.height - view.y) / view.s };
}
cv.addEventListener('pointerdown', (e) => {
  if (!M || e.button !== 0 || drag) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, tool };
  if (tool !== 'pan') activeMark = { type: tool, color: $('ink').value, width: +$('stroke').value * cv.width / cv.clientWidth / view.s, points: [point(e)] };
  cv.setPointerCapture(e.pointerId); draw();
});
cv.addEventListener('pointermove', (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  if (activeMark) {
    if (activeMark.type === 'rect') activeMark.points[1] = point(e); else activeMark.points.push(point(e));
  } else {
    const dpr = cv.width / cv.getBoundingClientRect().width;
    view.x = drag.vx + (e.clientX - drag.x) * dpr; view.y = drag.vy + (e.clientY - drag.y) * dpr;
  }
  draw();
});
function endDrag(e) {
  if (!drag || drag.id !== e.pointerId) return;
  if (activeMark && e.type === 'pointerup') {
    if (activeMark.type === 'rect') activeMark.points[1] = point(e); else activeMark.points.push(point(e));
    marks.push(activeMark);
  }
  activeMark = null; drag = null; syncMarks(); draw();
}
for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) cv.addEventListener(event, endDrag);
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (!M || drag) return;
  const r = cv.getBoundingClientRect(), dpr = cv.width / r.width, mx = (e.clientX - r.left) * dpr, my = (e.clientY - r.top) * dpr;
  const k = Math.exp(-e.deltaY * 0.0015), s = Math.min(fitS * 40, Math.max(fitS * 0.5, view.s * k));
  view.x = mx - (mx - view.x) * (s / view.s); view.y = my - (my - view.y) * (s / view.s); view.s = s; draw();
}, { passive: false });
cv.addEventListener('dblclick', () => { if (tool === 'pan') { fit(); draw(); } });
new ResizeObserver(() => { fit(); draw(); }).observe($('stage'));
loadModels().catch(err => { $('info').textContent = `角色清單載入失敗：${err.message}`; });
</script>
</body>

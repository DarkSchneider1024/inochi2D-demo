<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>精緻展示作品 · Inochi2D Demo</title>
<style>
  :root { --bg: #f7efe8; --bg2: #efd9dc; --card: rgba(255,255,255,.82); --ink: #2d2436; --muted: #6f6479;
          --accent: #8a6fd1; --line: rgba(60,40,80,.14); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1826; --bg2: #2c2034; --card: rgba(34,27,45,.86); --ink: #efe8f6;
      --muted: #b3a8c2; --accent: #b39cf5; --line: rgba(255,255,255,.12); }
  }
  :root[data-theme="dark"] { --bg: #1d1826; --bg2: #2c2034; --card: rgba(34,27,45,.86); --ink: #efe8f6;
      --muted: #b3a8c2; --accent: #b39cf5; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--ink);
         background: radial-gradient(120% 90% at 20% 10%, var(--bg) 0%, var(--bg2) 100%) fixed;
         font: 14px/1.55 system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  .stage { position: relative; min-height: 0; overflow: hidden; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .overlay { position: absolute; left: 16px; top: 14px; right: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .overlay > * { pointer-events: auto; }
  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  nav.tabs a { text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
               padding: 3px 11px; font-size: 13px; background: var(--card); }
  nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent);
               background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; pointer-events: none; }
  .bar { width: 220px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .hint { position: absolute; left: 16px; bottom: 12px; color: var(--muted); font-size: 12px; pointer-events: none; }
  aside { border-left: 1px solid var(--line); background: var(--card); overflow-y: auto; padding: 16px 16px 28px; }
  h1 { font-size: 19px; margin: 0 0 2px; }
  .lead { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .models { margin-bottom: 14px; }
  .models label { display: block; margin-bottom: 4px; color: var(--muted); }
  .models select { font: inherit; width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .models select:focus-visible, .row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .row button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px;
                padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .row button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .row a.btn { border: 1px solid var(--accent); color: var(--ink); border-radius: 999px; padding: 4px 11px; text-decoration: none; font: inherit; font-size: 13px; }
  .row a.btn:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .row button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .p { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin: 6px 0; }
  .p label { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .p input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
  .p.auto label::after { content: " · 自動"; color: var(--accent); font-size: 11px; }
  .phys { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
  .phys div { border: 1px solid var(--line); border-radius: 8px; aspect-ratio: 1; position: relative; }
  .phys div i { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: var(--accent); left: 50%; top: 50%; }
  .phys div span { position: absolute; left: 4px; bottom: 2px; right: 4px; font-size: 9.5px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .credit { margin-top: 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .credit a { color: var(--accent); }
  .stats { font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas><canvas id="emo" style="pointer-events: none"></canvas>
    <div class="overlay">
      <nav class="tabs"><a href="./">Demo</a><a href="gallery.html">作品集</a><a href="official.html" aria-current="page">精緻展示作品</a><a href="layers.html">圖層檢查</a><a href="voice/">角色聲音</a><a href="model3d.html">3D 模型</a><a href="secret.html">🔒 專屬區</a></nav>
    </div>
    <div class="loading" id="loading"><div>載入模型中…<div class="bar"><i id="bar"></i></div></div></div>
    <div class="hint">拖曳平移 · 滾輪縮放 · 雙擊回正</div>
  </div>
  <aside>
    <h1>精緻展示作品</h1>
    <p class="lead">完整綁定的 Inochi2D 角色，用支援遮罩、Composite、MeshGroup、混合模式與真物理的播放器呈現：Inochi2D 官方範例 Aka、Midori，以及照同樣綁法做的卡洛兒姐姐、卡洛特先生（動作與表情都內建在模型裡）。</p>
    <div class="models"><label for="models">選擇角色</label><select id="models"></select></div>
    <div class="stats" id="stats"></div>

    <h2>自動動作</h2>
    <div class="row" id="toggles"></div>
    <h2>展示</h2>
    <div class="row">
      <button class="primary" id="shake">🌀 晃動展示</button>
      <button id="qaRun" title="逐格大晃動檢核：固定每格 1/30 秒跑一次晃動展示（含真物理），每 0.1 秒擷取一張，最後把所有物理零件從 −1 掃到 +1、頭轉到四個角；自動找殘塊、破洞、半透明重影。先選一個表情，就會疊著那個表情檢查。">📸 逐格檢核</button>
      <button id="reset">↺ 重設參數</button>
      <button id="snap">📸 存圖</button>
      <a id="layersBtn" class="btn" href="layers.html" title="打開這個角色的拆圖整合圖：逐層看（包含被上層蓋住的部分）與單圖層疑點檢查" style="display:none">🧩 分層檢視</a>
    </div>

    <!-- 2026-10-23: the model's own animations (表情/… 動作/… 手勢/…); a model without any shows none of these -->
    <div id="feelSec" hidden><h2>喜怒哀樂（模型內建表情動畫＋漫畫符號）</h2><div class="row" id="feels"></div></div>
    <div id="actSec" hidden><h2>動作（模型內建動畫，點一下連續播放，再按一次停止）</h2><div class="row" id="acts"></div></div>
    <div id="gestSec" hidden><h2>手勢（模型內建動畫，播一次）</h2><div class="row" id="gests"></div></div>

    <h2>物理（即時輸出）</h2>
    <div class="phys" id="phys"></div>

    <h2>參數</h2>
    <div id="params"></div>

    <div class="credit" id="credit"></div>
  </aside>
</div>
<script type="module">
import { loadINP, Puppet, Renderer } from './inochi-full.js';
import { FEEL, stageEmote } from './feel.js';
import { showQA, grab } from './shake-qa.js';
import { mobilePanel } from './mobile-panel.js';

const MODELS = [
  { id: 'aka', name: 'Aka', desc: '紅髮狐耳少女', file: 'models/official/aka.inp' },
  { id: 'midori', name: 'Midori', desc: '綠髮少女（MeshGroup 版）', file: 'models/official/midori.inp' },
  { id: 'carol_v3', name: '卡洛兒姐姐', desc: '卡洛特工作室原創（V3）', file: 'models/carol_v3.inp', own: 'make_carol3_puppet.py' },
  { id: 'carol_v2', name: '卡洛兒姐姐 V2（舊版・不再維護）', desc: '卡洛特工作室原創（V2 舊版）', file: 'models/carol_v2.inp', own: 'make_carol2_puppet.py' },
  { id: 'mr_carrot_v3', name: '卡洛特先生', desc: '卡洛特工作室原創（V3）', file: 'models/mr_carrot_v3.inp', own: 'make_mrcarrot3_puppet.py' },
  { id: 'mr_carrot_v2', name: '卡洛特先生 V2（舊版・不再維護）', desc: '卡洛特工作室原創（V2 舊版）', file: 'models/mr_carrot_v2.inp', own: 'make_mrcarrot2_puppet.py' },
  { id: 'mr_carrot_gold_mage', name: '金髮魔法師卡洛特', desc: '卡洛特工作室原創', file: 'models/mr_carrot_gold_mage.inp', own: 'make_goldmage_puppet.py' },
];
// our own puppets name a few params differently (inochi-lite / the video stage use these): drive them under their names
const ALIAS = { 'Breath': 'Body:: Breath' };
const $ = (id) => document.getElementById(id);
const cv = $('cv'), stage = $('stage');
mobilePanel(stage, document.querySelector('aside'), () => fitView());      // phones: controls in a ☰ bottom sheet, the stage stays on top
const R = new Renderer(cv);
let P = null, model = null, view = { cx: 0, cy: 0, scale: 1 }, fit = null;
const manual = new Set();             // params the user grabbed: the idle motion leaves them alone
const auto = { follow: true, blink: true, breath: true, sway: true, talk: false, physics: true };
const autoLabels = { follow: '👀 視線跟隨', blink: '😌 眨眼', breath: '🫁 呼吸', sway: '🦶 重心移動', talk: '💬 說話', physics: '🌬 物理' };

// ---- versions (2026-10-23): versions.js -- the date version on every model, ?v=<build> against the browser cache
const { verOf, vurl, vlabel } = await import('./versions.js');

// ---- model picker ----
const FEATURED_IDS = ['aka', 'midori', 'carol_v3', 'mr_carrot_v3', 'mr_carrot_gold_mage'];
for (const id of FEATURED_IDS) {
  const m = MODELS.find(m => m.id === id);
  const option = document.createElement('option');
  option.value = m.id;
  option.textContent = `${m.name} ${vlabel(m.file) || ''}`.trim();
  $('models').appendChild(option);
}
$('models').onchange = () => open($('models').value);
for (const k of Object.keys(auto)) {
  const b = document.createElement('button');
  b.textContent = autoLabels[k];
  b.setAttribute('aria-pressed', auto[k]);
  b.onclick = () => { auto[k] = !auto[k]; b.setAttribute('aria-pressed', auto[k]); if (k === 'physics' && !auto[k]) settlePhysics(); refreshAutoMarks(); };
  $('toggles').appendChild(b);
}

const layersList = fetch('layers/models.json', { cache: 'no-store' }).then((r) => r.ok ? r.json() : []).then((l) => l.map((m) => m.id)).catch(() => []);
async function open(id) {
  model = MODELS.find((m) => m.id === id) || MODELS[0];
  history.replaceState(null, '', `?model=${model.id}`);
  $('models').value = model.id;
  $('loading').style.display = ''; $('bar').style.width = '0';
  const t0 = performance.now();
  const ver = verOf(model.file);
  const data = await loadINP(vurl(model.file), (f) => { $('bar').style.width = `${(f * 100).toFixed(0)}%`; });
  if (model.id !== id) return;                       // switched again while loading
  P = new Puppet(data);
  R.attach(P);
  manual.clear();
  const m = data.json.meta || {};
  const clean = (s) => (s || '').replace(/\0/g, '').trim();
  $('stats').textContent = (ver ? `版本 v${ver.version} · ` : '') + `${P.parts.length} 個圖層 · ${P.params.length} 個參數 · ${P.physics.length} 個物理 · ` +
    `${P.groups.length} 個 MeshGroup · ${(data.bytes / 1e6).toFixed(1)} MB · ${((performance.now() - t0) / 1000).toFixed(1)} 秒載入`;
  $('credit').innerHTML = model.own ? `「${model.name}」為卡洛特工作室原創角色，PSD 拆層與 Inochi2D 綁定由 Claude 以 Python 自動產生（<code>${model.own}</code>）。放在這裡和官方範例並排，比對參數、物理與畫面。播放器 <code>inochi-full.js</code> 為本站自寫。` + (ver && ver.history ? `<br>版本紀錄：${ver.history.slice(-5).reverse().map((h) => `<b>v${h.version}</b>（${h.build}）${h.note || ''}`).join('；')}` : '') : `「${model.name}」設計與綁定：<a href="${clean(m.contact) || 'https://twitter.com/seagetch'}" target="_blank" rel="noopener">${clean(m.artist) || 'seagetch'}</a>・授權 <a href="${clean(m.licenseURL) || 'https://creativecommons.org/licenses/by/4.0/'}" target="_blank" rel="noopener">CC BY 4.0</a>。來源：<a href="https://github.com/Inochi2D/example-models" target="_blank" rel="noopener">Inochi2D/example-models</a>（貼圖由 TGA 轉成 PNG，其餘未修改）。播放器 <code>inochi-full.js</code> 為本站自寫。`;
  // 🧩 分層檢視: only for the models that have a layer export (layers/models.json)
  layersList.then((ids) => { const b = $('layersBtn'); b.style.display = ids.includes(model.id) ? '' : 'none'; b.href = `layers.html?model=${model.id}`; });
  buildParams();
  buildPhys();
  buildMoves();
  settlePhysics();
  const b = P.bounds();
  fit = { cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2, w: b.x1 - b.x0, h: b.y1 - b.y0 };
  fitView();
  $('loading').style.display = 'none';
}

function settlePhysics() { if (!P) return; for (let i = 0; i < 120; i++) { P.update(); P.stepPhysics(1 / 60); } }

// ---- parameter sliders (physics outputs are shown as dots instead) ----
let sliders = [];
const physParams = () => new Set(P.physics.map((s) => s.param));
function buildParams() {
  const box = $('params'); box.textContent = ''; sliders = [];
  const ph = physParams();
  for (const p of P.params) {
    if (ph.has(p) || !p.bindings.length) continue;
    for (const ax of p.is_vec2 ? [0, 1] : [0]) {
      const d = document.createElement('div'); d.className = 'p';
      const name = p.name.trim() + (p.is_vec2 ? (ax ? ' · Y' : ' · X') : '');
      d.innerHTML = `<label title=""></label><output></output><input type="range" step="0.01">`;
      d.querySelector('label').textContent = name; d.querySelector('label').title = name;
      const inp = d.querySelector('input');
      inp.min = p.min[ax]; inp.max = p.max[ax]; inp.value = p.value[ax];
      inp.setAttribute('aria-label', name);
      inp.oninput = () => { manual.add(p.name.trim()); const v = [...p.value]; v[ax] = +inp.value; p.value = v; refreshAutoMarks(); };
      box.appendChild(d);
      sliders.push({ p, ax, inp, out: d.querySelector('output'), el: d });
    }
  }
  refreshAutoMarks();
}
function refreshAutoMarks() {
  for (const s of sliders) s.el.classList.toggle('auto', drivenNow().has(s.p.name.trim()) && !manual.has(s.p.name.trim()));
}
function buildPhys() {
  const box = $('phys'); box.textContent = '';
  for (const s of P.physics) {
    const d = document.createElement('div');
    d.innerHTML = '<i></i><span></span>';
    d.querySelector('span').textContent = s.param.name.replace(/:: Physics$/, '').replace(/::/g, '·');
    d.title = s.param.name;
    s.dot = d.querySelector('i');
    box.appendChild(d);
  }
}

// ---- idle motion ----
const ptr = { x: 0, y: 0, has: false };
let shakeT = -1, blinkNext = 1.5, blinkT = -1, time = 0;
function drivenNow() {
  const s = new Set();
  if (auto.follow || shakeT >= 0) for (const n of ['Head:: Yaw-Pitch', 'Body:: Yaw-Pitch', 'Eye:: Left:: Move', 'Eye:: Right:: Move', 'Head:: Roll', 'Body:: Roll', 'Body:: X:: Move']) s.add(n);
  if (auto.blink) s.add('Eye:: Left:: Blink').add('Eye:: Right:: Blink');
  if (auto.breath) s.add('Breath').add('Body:: Breath');
  if (auto.sway) s.add('Body:: X:: Move');
  if (auto.talk) s.add('Mouth:: Shape').add('Mouth:: Open').add('Mouth:: Form');
  return s;
}
const ease = (a, b, k) => a + (b - a) * k;
const look = { x: 0, y: 0 };
function drive(dt) {
  time += dt;
  const set = (name, x, y) => {
    if (!P.has(name) && P.has(ALIAS[name])) name = ALIAS[name];
    if (!manual.has(name) && P.has(name)) P.set(name, x, y);
  };
  // where to look: pointer, or the shake script
  let tx = 0, ty = 0, roll = 0, bx = 0;
  if (shakeT >= 0) {
    shakeT += dt;
    const t = shakeT;
    if (t < 3) { tx = Math.sign(Math.sin(t * 7)) * 1; ty = 0; bx = Math.sin(t * 7) * 0.6; }        // fast side to side
    else if (t < 6.5) { const a = (t - 3) * 2.4; tx = Math.cos(a); ty = Math.sin(a); }             // big circle
    else if (t < 9) { roll = Math.sin((t - 6.5) * 6); ty = Math.sin((t - 6.5) * 9) * 0.8; }       // tilt + nod
    else if (t > 10) shakeT = -1;
    const k = 1 - Math.exp(-dt * 14);
    look.x = ease(look.x, tx, k); look.y = ease(look.y, ty, k);
    set('Head:: Roll', roll); set('Body:: Roll', roll * 0.4); set('Body:: X:: Move', bx);
  } else if (auto.follow) {
    if (ptr.has) { tx = ptr.x; ty = ptr.y; }
    const k = 1 - Math.exp(-dt * 6);
    look.x = ease(look.x, tx, k); look.y = ease(look.y, ty, k);
    set('Head:: Roll', -look.x * look.y * 0.3);
  }
  if (shakeT >= 0 || auto.follow) {
    set('Head:: Yaw-Pitch', look.x, look.y);
    set('Body:: Yaw-Pitch', look.x * 0.45, look.y * 0.3);
    set('Eye:: Left:: Move', look.x); set('Eye:: Right:: Move', look.x);
  }
  if (auto.breath) set('Breath', (Math.sin(time * 2.1) + 1) / 2);
  // 重心移動 (2026-10-23): a slow weight shift side to side -- Body:: X:: Move moves the hips while the feet stay
  // planted (Aka's rig, and carol_v2's since today); the shake demo drives it harder
  if (auto.sway && shakeT < 0) set('Body:: X:: Move', 0.45 * Math.sin(time * 0.55) + 0.12 * Math.sin(time * 1.3 + 0.8));
  if (auto.blink) {
    blinkNext -= dt;
    if (blinkNext <= 0 && blinkT < 0) { blinkT = 0; blinkNext = 2 + Math.random() * 3.5; }
    let b = 0;
    if (blinkT >= 0) { blinkT += dt; b = blinkT < 0.07 ? blinkT / 0.07 : blinkT < 0.16 ? 1 : 1 - (blinkT - 0.16) / 0.1; if (blinkT > 0.26) { blinkT = -1; b = 0; } }
    set('Eye:: Left:: Blink', b); set('Eye:: Right:: Blink', b);
  }
  if (auto.talk && P.has('Mouth:: Shape')) {
    const p = P.byName['Mouth:: Shape'];
    const open = Math.max(0, Math.sin(time * 11) * 0.6 + Math.sin(time * 4.3) * 0.4);
    const vowel = (Math.sin(time * 1.7) + 1) / 2;
    set('Mouth:: Shape', ease(p.min[0], p.max[0], vowel), ease(p.defaults[1], p.max[1], open));
  } else if (!manual.has('Mouth:: Shape') && P.has('Mouth:: Shape')) P.set('Mouth:: Shape', P.byName['Mouth:: Shape'].defaults);
  if (!P.has('Mouth:: Shape') && P.has('Mouth:: Open')) {          // our puppets: Open (0..1) + Form (0 啊 / 1 喔)
    const open = auto.talk ? Math.max(0, Math.sin(time * 11) * 0.6 + Math.sin(time * 4.3) * 0.4) : 0;
    set('Mouth:: Open', open);
    if (P.has('Mouth:: Form')) set('Mouth:: Form', auto.talk ? (Math.sin(time * 1.7) > 0 ? 1 : 0) : 0);
  }
}

// ---- 喜怒哀樂 / 動作 / 手勢 (2026-10-23, user: 動作和表情烘進模型，頁面直接讀模型播放): they come from the model's own
// Inochi2D animations (make_carol2_puppet.py bakes them), grouped by name: 表情/… (loops; faded in and laid ON TOP of
// what is already moving), 動作/… (loops; takes over its params), 手勢/… (plays once). A model without animations
// (the official Aka / Midori) shows none of the three.
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const feel = { want: '', shown: '', w: 0, t0: 0 };
const act = { a: '', t0: 0, touched: new Set() };
const gest = { a: '', t0: 0, touched: new Set() };
const NEUTRAL = '😐 平常';
const groupOf = (pre) => Object.keys(P.animations).filter((n) => n.startsWith(pre + '/'));
function buttons(box, names, onPick) {
  box.textContent = '';
  for (const n of names) {
    const b = document.createElement('button'); b.textContent = n.slice(n.indexOf('/') + 1) || NEUTRAL; b.dataset.name = n;
    b.setAttribute('aria-pressed', 'false'); b.onclick = () => onPick(n); box.appendChild(b);
  }
}
const press = (box, cur) => { for (const b of box.children) b.setAttribute('aria-pressed', b.dataset.name === cur); };
function buildMoves() {
  feel.want = feel.shown = ''; feel.w = 0; act.a = gest.a = ''; act.touched.clear(); gest.touched.clear();
  const fs = groupOf('表情'), as = groupOf('動作'), gs = groupOf('手勢');
  $('feelSec').hidden = !fs.length; $('actSec').hidden = !as.length; $('gestSec').hidden = !gs.length;
  buttons($('feels'), fs.length ? ['', ...fs] : [], (n) => { feel.want = n; press($('feels'), n); });
  press($('feels'), '');
  buttons($('acts'), as, (n) => { act.a = act.a === n ? '' : n; act.t0 = time; });
  buttons($('gests'), gs, (n) => { gest.a = gest.a === n ? '' : n; gest.t0 = time; });
}
function handBack(s) {                     // an animation stopped: its params go back to rest (unless the user holds them)
  for (const p of s.touched) if (!manual.has(p.name.trim())) p.value = [...p.defaults];
  s.touched.clear();
}
function play(name, t, how, w = 1, s = null) {
  for (const { param: p, axis, value } of P.sampleAnimation(name, t)) {
    if (manual.has(p.name.trim())) continue;
    s?.touched.add(p);
    const v = [...p.value];
    if (/Blink$/.test(p.name)) v[axis] = Math.max(v[axis], w * value);           // auto blinks still happen
    else if (how === 'add') v[axis] += w * (value - p.defaults[axis]);
    else v[axis] = v[axis] + (value - v[axis]) * w;
    v[axis] = clamp(v[axis], p.min[axis], p.max[axis]);
    p.value = v;
  }
}
function applyMoves(dt) {
  // 表情: the old one eases out first, then the new one eases in (never a cut)
  if (feel.shown !== feel.want) { feel.w = Math.max(0, feel.w - dt * 6); if (feel.w <= 0) { feel.shown = feel.want; feel.t0 = time; } }
  else feel.w = feel.shown ? Math.min(1, feel.w + dt * 4) : 0;
  if (feel.shown && feel.w > 0) play(feel.shown, time - feel.t0, 'add', feel.w);
  // 動作: loops until pressed again
  if (act.touched.size && act.touched.a !== act.a) handBack(act);
  press($('acts'), act.a);
  if (act.a) { play(act.a, time - act.t0, 'set', 1, act); act.touched.a = act.a; }
  // 手勢: once, then hands the arm back
  if (gest.a && time - gest.t0 > P.animationLength(gest.a)) gest.a = '';
  if (gest.touched.size && !gest.a) handBack(gest);
  press($('gests'), gest.a);
  if (gest.a) play(gest.a, time - gest.t0, 'set', 1, gest);
}
// the 漫符 on the face (臉) / eye (眼白_*) boxes, drawn by the video stage's own code (feel.js)
const emoC = $('emo'), emoX = emoC.getContext('2d');
function screenBox(n) {
  if (!n || !n.pos) return null;
  const W2 = cv.width / 2, H2 = cv.height / 2;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < n.pos.length; i += 2) {
    const X = W2 + (n.pos[i] - view.cx) * view.scale, Y = H2 + (n.pos[i + 1] - view.cy) * view.scale;
    x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y);
  }
  return x1 > x0 ? { x0, y0, x1, y1, cx: (x0 + x1) / 2, w: x1 - x0 } : null;
}
function drawFeel() {
  if (emoC.width !== cv.width || emoC.height !== cv.height) { emoC.width = cv.width; emoC.height = cv.height; }
  emoX.clearRect(0, 0, emoC.width, emoC.height);
  const id = Object.keys(FEEL).find((k) => FEEL[k].label === feel.shown.slice(feel.shown.indexOf('/') + 1));
  if (!id || !FEEL[id].emote || feel.w <= 0) return;
  const F = screenBox(P.parts.find((q) => q.name === '臉'));
  if (!F) return;
  const eyes = ['眼白_R', '眼白_L'].map((nm) => screenBox(P.parts.find((q) => q.name === nm))).filter(Boolean);
  const wMax = Math.max(0, ...eyes.map((e) => e.w));
  const S = { face: F, h: 6 * (F.y1 - F.y0), dir: 1, sx: (F.x0 + F.x1) / 2, top: F.y0, eyes: eyes.filter((e) => e.w > 0.4 * wMax) };
  stageEmote.uiEmote(emoX, { emo: { v: id, w: feel.w, u: time - feel.t0 } }, S, view.scale);
}

// ---- view: fit, pan, zoom ----
let zoom = 1, pan = { x: 0, y: 0 };
function fitView() { zoom = 1; pan = { x: 0, y: 0 }; resize(); }
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1), r = stage.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  if (!fit) return;
  const base = Math.min(cv.width / (fit.w * 1.08), cv.height / (fit.h * 1.06));
  view = { cx: fit.cx - pan.x, cy: fit.cy - pan.y, scale: base * zoom };
}
new ResizeObserver(resize).observe(stage);
let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, px: pan.x, py: pan.y }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  const r = stage.getBoundingClientRect();
  ptr.x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2.4));
  ptr.y = Math.max(-1, Math.min(1, -((e.clientY - r.top) / r.height - 0.32) * 2.4));
  ptr.has = true;
  if (drag) {
    const dpr = cv.width / r.width;
    pan.x = drag.px + ((e.clientX - drag.x) * dpr) / view.scale;
    pan.y = drag.py + ((e.clientY - drag.y) * dpr) / view.scale;
    resize();
  }
});
cv.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.min(8, Math.max(0.4, zoom * Math.exp(-e.deltaY * 0.0015))); resize(); }, { passive: false });
cv.addEventListener('dblclick', fitView);

$('shake').onclick = () => { shakeT = 0; };

// ---- 逐格大晃動檢核 (2026-10-23, user: 把逐格大晃動也實裝到精緻展示區): the 晃動展示 script stepped at a FIXED 1/30 s
// (the same frames on every machine / frame rate, real physics included), one capture every 0.1 s, then an extreme
// sweep -- every physics param -1 -> +1 with the head through its four corners (a shake does not always swing every
// lock to its end). The live loop pauses meanwhile. A chosen 表情 stays on, so 驚訝 etc. can be checked under the shake.
// Analysis + review overlay: shake-qa.js (index.html's 📸 即時截圖 checks). Scripts: await window.demo.runQA().
let qaBusy = false;
async function runQA() {
  if (!P || qaBusy) return window.qa;
  qaBusy = true; window.qa = { done: false };
  const btn = $('qaRun'), btnText = btn.textContent;
  const keep = { ...auto }, z0 = zoom, p0 = { ...pan };
  Object.assign(auto, { follow: false, blink: false, breath: false, sway: false, talk: false, physics: true });
  fitView();
  P.reset(); manual.clear(); shakeT = -1; look.x = look.y = 0; act.a = gest.a = '';
  const DT = 1 / 30, list = [];
  const yaw = () => (P.get('Head:: Yaw-Pitch') || [0, 0]);
  const tag = () => `轉 ${yaw()[0].toFixed(2)}／仰 ${(yaw()[1] ?? 0).toFixed(2)}／歪 ${(P.get('Head:: Roll')?.[0] ?? 0).toFixed(2)}`;
  const step = (sweep) => { drive(DT); applyMoves(DT); P.update(); if (!sweep) P.stepPhysics(DT); R.draw(view); };
  const yieldUI = (msg) => { btn.textContent = msg; return new Promise((r) => setTimeout(r, 0)); };   // (rAF stalls in a background tab)
  for (let i = 0; i < 60; i++) step(false);                           // 2 s at rest (the chosen 表情 eases in)
  const ref = { c: grab(cv) };
  shakeT = 0;
  for (let i = 0; shakeT >= 0; i++) {                                  // the 晃動展示 script (10 s)
    const t = shakeT; step(false);
    if (i % 3 === 2) list.push({ c: grab(cv), t, label: tag() });
    if (i % 6 === 5) await yieldUI(`📸 檢核中… ${t.toFixed(1)}s`);
  }
  const phys = [...new Set(P.physics.map((s) => s.param))];
  const N = 48, t0 = list.length ? list[list.length - 1].t + 0.1 : 10;
  for (let i = 0; i <= N; i++) {                                      // extreme sweep (1.6 s)
    const v = i / N, k = clamp(-Math.cos(Math.PI * v) * 1.15, -1, 1);
    const c = [[1, 1], [-1, 1], [-1, -1], [1, -1]][Math.min(3, Math.floor(v * 4))];
    drive(DT); applyMoves(DT);
    if (P.has('Head:: Yaw-Pitch')) P.set('Head:: Yaw-Pitch', c[0], c[1]);
    if (P.has('Head:: Roll')) P.set('Head:: Roll', 0.8 * c[0]);
    for (const p of phys) p.value = p.is_vec2 ? [clamp(k, p.min[0], p.max[0]), clamp(0.5 * k, p.min[1], p.max[1])] : [clamp(k, p.min[0], p.max[0]), 0];
    P.update(); R.draw(view);
    if (i % 3 === 0) list.push({ c: grab(cv), t: t0 + i * DT, sweep: true, label: `物理 ${k.toFixed(2)}　${tag()}` });
    if (i % 6 === 5) await yieldUI(`📸 檢核中… 極限 ${Math.round(v * 100)}%`);
  }
  Object.assign(auto, keep); zoom = z0; pan = p0; resize();
  P.reset(); settlePhysics(); refreshAutoMarks();
  btn.textContent = btnText; qaBusy = false;
  return showQA({ title: `逐格大晃動檢核 · ${model.name}${feel.want ? `（${feel.want.slice(feel.want.indexOf('/') + 1)}）` : ''}`,
                  file: model.id, list, ref, again: runQA,
                  note: '晃動展示每格固定 1/30 秒（含物理）每 0.1 秒一張，最後是物理零件 −1→+1 與頭轉四角的極限掃描（標［極限］）。' });
}
$('qaRun').onclick = runQA;
$('reset').onclick = () => { if (!P) return; P.reset(); manual.clear(); for (const s of sliders) s.inp.value = s.p.value[s.ax]; settlePhysics(); refreshAutoMarks(); };
$('snap').onclick = () => { const a = document.createElement('a'); a.download = `${model.id}.png`; a.href = cv.toDataURL('image/png'); a.click(); };

// ---- loop ----
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (P && !qaBusy) {
    drive(dt);
    applyMoves(dt);
    P.update();
    if (auto.physics) P.stepPhysics(dt);
    R.draw(view);
    drawFeel();
    uiT += dt;
    if (uiT > 0.05) {
      uiT = 0;
      for (const s of sliders) if (document.activeElement !== s.inp) { s.inp.value = s.p.value[s.ax]; s.out.textContent = (+s.p.value[s.ax]).toFixed(2); }
      for (const s of P.physics) if (s.dot) {
        const v = s.param.value, p = s.param;
        const nx = (v[0] - p.min[0]) / (p.max[0] - p.min[0]), ny = p.is_vec2 ? (v[1] - p.min[1]) / (p.max[1] - p.min[1]) : 0.5;
        s.dot.style.left = `${nx * 100}%`; s.dot.style.top = `${(1 - ny) * 100}%`;
      }
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.demo = { get puppet() { return P; }, renderer: R, auto, open, runQA, get view() { return view; } };
open(new URLSearchParams(location.search).get('model') || 'aka').catch((e) => {
  $('loading').textContent = `載入失敗：${e.message}`;
  console.error(e);
});
</script>
</body>

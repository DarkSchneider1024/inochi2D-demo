  <style>
    :root {
      --primary: #ff6b35;
      --primary-light: #ff8c42;
      --accent: #2ec4b6;
      --pink: #ec4899;
      --bg-dark: #0b0f17;
      --card-bg: #141b26;
      --card-border: #212c3d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --ready-color: #10b981;
      --ready-bg: rgba(16, 185, 129, 0.12);
      --pending-color: #f59e0b;
      --pending-bg: rgba(245, 158, 11, 0.12);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at 50% 0%, #151d2c 0%, #0a0d14 70%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 120px;
      line-height: 1.6;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 107, 53, 0.12);
      color: var(--primary-light);
      border: 1px solid rgba(255, 107, 53, 0.3);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, #ffc1a1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.12rem;
      max-width: 780px;
      margin: 0 auto 24px;
    }

    /* Stats Banner */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .stat-pill {
      background: rgba(20, 27, 38, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill strong { color: #ffffff; }
    .stat-pill.ready strong { color: var(--ready-color); }
    .stat-pill.pending strong { color: var(--pending-color); }

    /* Control & Filter Bar */
    .filter-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      background: rgba(20, 27, 38, 0.6);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
    }

    .tab-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
    }

    .search-input {
      background: #0f141d;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      width: 220px;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.25s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .card.is-ready {
      border-left: 4px solid var(--ready-color);
    }

    .card.is-pending {
      border-left: 4px solid var(--pending-color);
      border-style: dashed;
      background: rgba(20, 27, 38, 0.65);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .avatar-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .character-info {
      flex: 1;
    }

    .character-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }

    .character-role {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Status Badges */
    .status-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-badge.ready {
      background: var(--ready-bg);
      color: var(--ready-color);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.pending {
      background: var(--pending-bg);
      color: var(--pending-color);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* Spec tags */
    .spec-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .spec-tag {
      font-size: 0.75rem;
      font-weight: 600;
      background: #0f141d;
      border: 1px solid var(--card-border);
      padding: 2px 8px;
      border-radius: 6px;
      color: #cbd5e1;
    }

    .spec-tag.highlight {
      color: var(--primary-light);
      border-color: rgba(255, 107, 53, 0.25);
    }

    /* Quote Box */
    .quote-box {
      background: rgba(11, 15, 23, 0.7);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      border-left: 3px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .quote-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .quote-text {
      font-size: 0.92rem;
      color: #f1f5f9;
      font-weight: 500;
      line-height: 1.45;
    }

    /* Audio Player Widget */
    .player-widget {
      background: #0d121b;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-play-sm {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(255, 107, 53, 0.3);
      transition: transform 0.15s;
    }
    .btn-play-sm:hover { transform: scale(1.08); }

    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-track-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 5px;
      background: #243042;
      border-radius: 999px;
      cursor: pointer;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    /* Sub variant select for Mr Carrot */
    .variant-select {
      background: #0f141d;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      width: 100%;
      margin-top: 4px;
      cursor: pointer;
    }

    /* Pending action banner */
    .pending-action-box {
      background: rgba(245, 158, 11, 0.05);
      border: 1px dashed rgba(245, 158, 11, 0.3);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .pending-hint {
      font-size: 0.8rem;
      color: #fbbf24;
    }

    .btn-action {
      background: #1e2838;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #2b394e;
      border-color: #3f526d;
    }

    /* Notes Drawer */
    details.notes-drawer {
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 8px;
    }
    details.notes-drawer summary {
      cursor: pointer;
      color: var(--text-dim);
      font-weight: 600;
      user-select: none;
    }
    details.notes-drawer summary:hover { color: var(--text-muted); }
    details.notes-drawer p {
      margin-top: 6px;
      background: rgba(0,0,0,0.2);
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      color: #94a3b8;
      white-space: pre-wrap;
    }

    /* Bottom master bar */
    .master-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 15, 23, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 24px;
      z-index: 99;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
    }

    .master-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .master-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }
    .master-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: #1e293b;
      color: white;
      border: 1px solid var(--primary);
      padding: 12px 20px;
      border-radius: var(--radius-md);
      z-index: 999;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
  </style>
</head>

    let registryData = null;
    let currentFilter = 'all';
    let currentActiveId = null;
    let currentActiveSrc = null;
    const cardCurrentTrack = {};
    const audio = document.getElementById('global-audio');

    async function loadData() {
      try {
        const resp = await fetch('voice_registry.json');
        if (resp.ok) {
          registryData = await resp.json();
        }
      } catch (err) {
        console.warn("Local fetch blocked/failed (normal in file:/// protocol). Using embedded data.", err);
      }
      if (!registryData) {
        registryData = EMBEDDED_REGISTRY;
      }
      if (registryData && registryData.characters) {
        const total = registryData.characters.length;
        const ready = registryData.characters.filter(c => c.status === 'ready').length;
        const pending = total - ready;
        document.getElementById('stat-total').innerText = total;
        document.getElementById('stat-ready').innerText = ready;
        document.getElementById('stat-pending').innerText = pending;
      }
      renderCards();
    }

    function setFilter(f, btnElem) {
      currentFilter = f;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = btnElem || (window.event && window.event.currentTarget) || (window.event && window.event.target);
      if (activeBtn) activeBtn.classList.add('active');
      filterCards();
    }

    function filterCards() {
      const q = document.getElementById('search-box').value.trim().toLowerCase();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const status = card.dataset.status;
        const gender = card.dataset.gender;
        const text = card.innerText.toLowerCase();

        let matchTab = true;
        if (currentFilter === 'ready' && status !== 'ready') matchTab = false;
        if (currentFilter === 'pending' && status !== 'pending') matchTab = false;
        if (currentFilter === 'female' && gender !== 'female') matchTab = false;
        if (currentFilter === 'male' && gender !== 'male') matchTab = false;
        if (currentFilter === 'creature' && !['creature', 'child'].includes(gender)) matchTab = false;

        const matchSearch = !q || text.includes(q);

        card.style.display = (matchTab && matchSearch) ? 'flex' : 'none';
      });
    }

    function renderCards() {
      if (!registryData) return;
      const grid = document.getElementById('characters-grid');
      grid.innerHTML = '';

      registryData.characters.forEach(c => {
        const isReady = c.status === 'ready';
        const card = document.createElement('div');
        card.className = `card ${isReady ? 'is-ready' : 'is-pending'}`;
        card.dataset.status = c.status;
        card.dataset.gender = c.gender;
        card.id = `card-${c.id}`;

        let playerHtml = '';
        if (isReady && c.audio_file) {
          playerHtml = `
            <div class="player-widget">
              <button class="btn-play-sm" id="btn-play-${c.id}" onclick="togglePlayCard('${c.id}')">▶</button>
              <div class="player-info">
                <div class="player-track-name" id="track-name-${c.id}">示範音檔：${c.name}</div>
                <div class="progress-bar-wrap" onclick="seekCard(event, '${c.id}')">
                  <div class="progress-bar-fill" id="prog-${c.id}"></div>
                </div>
              </div>
            </div>
          `;

          if (c.alternate_audio_files) {
            playerHtml += `
              <div style="margin-top: 8px;">
                <label style="font-size:0.75rem; color:var(--primary-light); font-weight:700; display:block; margin-bottom:4px;">🎧 切換候選聲線試聽 (${c.alternate_audio_files.length} 款)：</label>
                <select class="variant-select" id="select-${c.id}" onchange="changeVariant('${c.id}', this.value, '${c.name}', this)">
                  ${c.alternate_audio_files.map(opt => `
                    <option value="${opt.file}">${opt.name}</option>
                  `).join('')}
                </select>
              </div>
            `;
            if (c.id === 'mr_carrot') {
              playerHtml += `
                <div style="margin-top:6px; text-align:right;">
                  <a href="mr_carrot_audition/index.html" target="_blank" style="font-size:0.78rem; color:#ff8c42; text-decoration:none; font-weight:700;">
                    📊 開啟卡洛特 20 款獨立大評選與評分面板 ↗
                  </a>
                </div>
              `;
            }
          }
        } else {
          playerHtml = `
            <div class="pending-action-box">
              <div class="pending-hint">🚧 待製作（人設指令已配置）</div>
              <button class="btn-action" onclick="copyPrompt('${c.id}')">📋 複製生成指令</button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-header">
            <div class="avatar-wrap">${c.avatar_emoji}</div>
            <div class="character-info">
              <h3 class="character-name">${c.name}</h3>
              <div class="character-role">${c.role}</div>
            </div>
            <div>
              ${c.is_spotlight ? '<span class="status-badge" style="background:rgba(16,185,129,0.18); color:#10b981; border:1px solid rgba(16,185,129,0.4); margin-right:4px;">🌟 正片實機音檔</span>' : ''}
              <span class="status-badge ${c.status}">${isReady ? '✅ 已製作' : '🚧 待製作'}</span>
            </div>
          </div>

          <div class="spec-tags">
            <span class="spec-tag highlight">音色：${c.voice_name}</span>
            <span class="spec-tag">模型：${c.model}</span>
            <span class="spec-tag">${getGenderLabel(c.gender)}</span>
          </div>

          <div class="quote-box">
            <span class="quote-label">標誌台詞 (Quote)</span>
            <p class="quote-text">「${c.sample_quote}」</p>
          </div>

          ${playerHtml}

          <details class="notes-drawer">
            <summary>查看導演指示詞 (Director's Notes)</summary>
            <p>${c.director_notes}</p>
          </details>
        `;

        grid.appendChild(card);
      });
    }

    function getGenderLabel(g) {
      if (g === 'female') return '女聲';
      if (g === 'male') return '男聲';
      if (g === 'creature') return '萌寵/動物';
      if (g === 'child') return '童音/正太';
      if (g === 'elder') return '長者';
      return g;
    }

    function togglePlayCard(id) {
      const char = registryData.characters.find(c => c.id === id);
      if (!char) return;
      const track = cardCurrentTrack[id] || { src: char.audio_file, title: `示範音檔：${char.name}` };
      playTrack(id, track.src, track.title);
    }

    function playTrack(id, src, title) {
      if (currentActiveId === id && currentActiveSrc === src) {
        if (audio.paused) {
          audio.play().catch(e => showToast("播放受限：" + e.message));
        } else {
          audio.pause();
        }
        updateUI();
        return;
      }

      currentActiveId = id;
      currentActiveSrc = src;
      audio.src = src;
      audio.currentTime = 0;
      audio.play().catch(e => showToast("播放受限或檔案讀取中：" + e.message));

      document.getElementById('master-title').innerText = title;
      document.getElementById('master-sub').innerText = src;
      updateUI();
    }

    function changeVariant(id, newSrc, baseTitle, selectElem) {
      const el = selectElem || (window.event && (window.event.currentTarget || window.event.target)) || document.getElementById(`select-${id}`);
      const optName = el && el.options ? el.options[el.selectedIndex].text : '';
      const fullTitle = `${baseTitle} - ${optName}`;

      cardCurrentTrack[id] = { src: newSrc, title: fullTitle };
      const trackElem = document.getElementById(`track-name-${id}`);
      if (trackElem) {
        trackElem.innerText = `示範音檔：${optName}`;
      }

      playTrack(id, newSrc, fullTitle);
    }

    function playAudio(id, src, title) {
      playTrack(id, src, title);
    }

    function toggleGlobalAudio() {
      if (!audio.src) return;
      if (audio.paused) audio.play();
      else audio.pause();
      updateUI();
    }

    function updateUI() {
      const isPaused = audio.paused;
      document.getElementById('master-btn').innerText = isPaused ? '▶' : '⏸';

      registryData.characters.forEach(c => {
        const btn = document.getElementById(`btn-play-${c.id}`);
        if (btn) {
          btn.innerText = (c.id === currentActiveId && !isPaused) ? '⏸' : '▶';
        }
      });
    }

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('master-progress').style.width = pct + '%';
      if (currentActiveId) {
        const p = document.getElementById(`prog-${currentActiveId}`);
        if (p) p.style.width = pct + '%';
      }
    });

    audio.addEventListener('play', updateUI);
    audio.addEventListener('pause', updateUI);
    audio.addEventListener('ended', () => {
      updateUI();
      if (currentActiveId) {
        const p = document.getElementById(`prog-${currentActiveId}`);
        if (p) p.style.width = '0%';
      }
    });

    function seekGlobalAudio(e) {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    }

    function seekCard(e, id) {
      if (currentActiveId !== id) return;
      seekGlobalAudio(e);
    }

    function copyPrompt(id) {
      const char = registryData.characters.find(c => c.id === id);
      if (!char) return;

      const snippet = `### DIRECTOR'S NOTES\n${char.director_notes}\n\n### TRANSCRIPT\n${char.sample_quote}`;
      navigator.clipboard.writeText(snippet).then(() => {
        showToast(`已複製「${char.name}」的語音生成 Prompt！直接貼入即可調用。`);
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    loadData();
  </script>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inochi2D 角色 Demo</title>
<style>
  :root {
    --bg: #f7efe8; --bg2: #efd9dc; --panel: rgba(255,255,255,.78); --ink: #2d2436; --muted: #6f6479;
    --accent: #8a6fd1; --line: rgba(60,40,80,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1826; --bg2: #2c2034; --panel: rgba(30,24,40,.82); --ink: #efe8f6; --muted: #b3a8c2; --accent: #b39cf5; --line: rgba(255,255,255,.12); }
  }
  :root[data-theme="dark"] { --bg: #1d1826; --bg2: #2c2034; --panel: rgba(30,24,40,.82); --ink: #efe8f6; --muted: #b3a8c2; --accent: #b39cf5; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(120% 90% at 20% 10%, var(--bg) 0%, var(--bg2) 100%); color: var(--ink);
         font: 14px/1.5 system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  .wrap { display: grid; grid-template-columns: 1fr 320px; height: 100%; }
  .stage { position: relative; min-height: 60vh; overflow: hidden; }
  .stage::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: 3.2%; height: 16px; border-radius: 50%;
                  background: radial-gradient(closest-side, rgba(60,40,80,.28), transparent); pointer-events: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .status { position: absolute; left: 16px; top: 12px; color: var(--muted); font-size: 12px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow: auto; backdrop-filter: blur(8px); }
  h1 { font-size: 17px; margin: 0 0 4px; }
  nav.tabs { display: flex; gap: 6px; margin: 0 0 14px; }
  nav.tabs a { text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  select { font: inherit; width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  label.row { display: grid; grid-template-columns: 1fr 44px; gap: 2px 8px; align-items: center; margin: 8px 0; }
  label.row span.v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  label.row input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .toggles label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .toggles input { accent-color: var(--accent); }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .exprs { display: flex; flex-wrap: wrap; gap: 6px; }
  .exprs button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .zoombtn { position: absolute; right: 10px; top: 8px; z-index: 5; font-size: 13px; padding: 5px 10px; border-radius: 999px;
             background: var(--panel); backdrop-filter: blur(6px); }
  /* 前後角色切換浮動按鈕（對應實體「前」「後」按鈕） */
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 12px 14px; font: inherit; font-size: 15px; font-weight: 600; line-height: 1;
    border-radius: 12px; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
    transition: transform .18s cubic-bezier(0.16, 1, 0.3, 1), background .18s, border-color .18s, color .18s, box-shadow .18s;
    user-select: none;
  }
  .nav-btn .nav-arrow { font-size: 18px; line-height: 1; color: var(--accent); }
  .nav-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: color-mix(in srgb, var(--panel) 82%, var(--accent));
    transform: translateY(-50%) scale(1.08);
    box-shadow: 0 6px 20px rgba(0,0,0,.22);
  }
  .nav-btn:active { transform: translateY(-50%) scale(0.95); }
  .nav-prev { left: 16px; }
  .nav-next { right: 16px; }
  @media (max-width: 760px) {
    .nav-btn { padding: 9px 8px; font-size: 13px; }
    .nav-btn .nav-arrow { font-size: 14px; }
    .nav-prev { left: 6px; }
    .nav-next { right: 6px; }
  }
  /* full view: the character pane takes the whole screen, the controls are hidden (phones: the split is too small) */
  body.full .wrap { grid-template-columns: 1fr !important; }
  body.full aside { display: none; }
  body.full .stage { height: 100dvh; }
  .note { color: var(--muted); font-size: 12px; margin-top: 16px; }
  /* phones: character on the left, parameters on the right, two independent panes; the page itself never
     scrolls, so swiping the controls can't move the character */
  @media (max-width: 760px) {
    html, body { height: 100dvh; overflow: hidden; overscroll-behavior: none; }
    .wrap { grid-template-columns: 52% 48%; grid-template-rows: 100dvh; height: 100dvh; }
    .stage { min-height: 0; height: 100dvh; }
    aside { height: 100dvh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
            padding: 12px 10px; font-size: 13px; }
    h1 { font-size: 15px; } .sub { font-size: 11px; }
    nav.tabs a { padding: 3px 9px; font-size: 12px; }
    .status { font-size: 10px; left: 8px; top: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage"><canvas id="c"></canvas><div class="status" id="status">載入模型中…</div>
    <button class="nav-btn nav-prev" id="navPrev" aria-label="切換至上一個角色（前）" title="切換至上一個角色（前）"><span class="nav-arrow">‹</span><span class="nav-text">前</span></button>
    <button class="nav-btn nav-next" id="navNext" aria-label="切換至下一個角色（後）" title="切換至下一個角色（後）"><span class="nav-text">後</span><span class="nav-arrow">›</span></button>
    <button class="zoombtn" id="zoom" aria-pressed="false" title="放大全景（隱藏控制面板）">⛶ 放大</button>
    <button class="zoombtn" id="bust" aria-pressed="false" style="top:46px;display:none" title="全身 / 半身特寫">半身</button></div>
  <aside>
    <nav class="tabs"><a href="./" aria-current="page">Demo</a><a href="gallery.html">作品集</a><a href="model3d.html">3D 模型</a><a href="secret.html">🔒 專屬區</a></nav>
    <h1 id="title">Inochi2D</h1>
    <p class="sub" id="sub">由 PSD 自動綁定的 Inochi2D 模型，用自寫的 WebGL 播放器即時渲染。</p>
    <label for="pick" class="sub" style="display:block;margin-bottom:4px">角色</label>
    <select id="pick"></select>
    <h2>自動動作</h2>
    <div class="toggles">
      <label><input type="checkbox" id="tLook" checked> 視線跟著滑鼠／手指（手機：點或滑角色畫面）</label>
      <label><input type="checkbox" id="tBlink" checked> 自動眨眼</label>
      <label><input type="checkbox" id="tBreath" checked> 呼吸</label>
      <label><input type="checkbox" id="tPhys" checked> 頭髮物理</label>
      <label id="tArmsLab"><input type="checkbox" id="tArms" checked> 手臂自然擺動</label>
      <label><input type="checkbox" id="tTalk"> 說話</label>
      <label class="raise-only"><input type="checkbox" id="tRaise"> 舉手打招呼（放下 ↔ 舉手 自然轉場，舉起後揮手）</label>
      <label class="raise-only"><input type="checkbox" id="tRaiseLoop"> 自動循環舉手／放下（每 6 秒）</label>
      <label class="front-only"><input type="checkbox" id="tStroll" checked> 走路（自然轉身：先轉頭 30°，有側面模型的角色會轉成側面走）</label>
      <label class="side-only"><input type="checkbox" id="tWalk" checked> 原地走路（側面模型）</label>
      <label class="side-only"><input type="checkbox" id="tTurn" checked> 70°↔90° 轉頭（側面模型）</label>
      <label class="body-only"><input type="checkbox" id="tBody" checked> 身體跟著轉（身體角度，約頭部的一半、慢半拍）</label>
      <label class="ear-only"><input type="checkbox" id="tEar" checked> 耳朵偶爾抖一下</label>
    </div>
    <div class="expr-only">
      <h2>表情</h2>
      <div class="exprs" id="exprs"></div>
    </div>
    <div class="raise-only">
      <h2>手勢</h2>
      <div class="exprs"><button id="waveBtn" aria-pressed="false">👋 揮手</button></div>
    </div>
    <div class="eat-only">
      <h2>動作</h2>
      <div class="exprs"><button id="eatBtn" aria-pressed="false">🥕 吃胡蘿蔔</button></div>
    </div>
    <div class="gest-only">
      <h2>手勢</h2>
      <div class="exprs" id="gests"></div>
    </div>
    <h2>參數</h2>
    <div id="params"></div>
    <p><button id="reset">重設參數</button></p>
    <p class="note">勾選的自動動作會接管對應參數；想手動拉滑桿時，先取消勾選。桌機可用滑鼠拖曳平移、滾輪縮放；角色會自動站在地面上（雙擊畫面回到原位）。</p>
  </aside>
</div>
<script type="module">
import { loadINP, Puppet } from './inochi-lite.js';
import { GL, FEET } from './stage.js';          // same renderer as the video stage (cross-fades, one head)

const canvas = document.getElementById('c'), status = document.getElementById('status');
const LABELS = { 'Head:: Yaw-Pitch': ['頭部 左右', '頭部 上下'], 'Head:: Roll': ['頭部 歪斜'],
  'Eye:: Left:: Blink': ['左眼 閉合'], 'Eye:: Right:: Blink': ['右眼 閉合'], 'Mouth:: Open': ['嘴巴 張開'],
  'Body:: Breath': ['呼吸'], 'Hair:: Sway': ['頭髮 擺動'],
  'Arm:: Right:: Swing': ['右臂 擺動'], 'Arm:: Right:: Bend': ['右臂 彎曲'], 'Hand:: Right:: Wrist': ['右手腕'],
  'Arm:: Left:: Raise': ['左手 舉起（0 放下 → 1 舉手）'], 'Arm:: Left:: Swing': ['左臂 擺動'], 'Arm:: Left:: Bend': ['左臂 彎曲'], 'Hand:: Left:: Wrist': ['左手腕'],
  'Basket:: Swing': ['籃子 擺動'], 'Tail:: Sway': ['尾巴 擺動'],
  'Chest:: Sway X': ['胸部 左右晃'], 'Chest:: Bounce Y': ['胸部 上下彈'], 'Chest:: Squash': ['胸部 寬窄'],
  'Head:: Turn': ['頭部 90°→70°'], 'Head:: Nod': ['點頭'], 'Body:: Lean': ['身體 前傾'], 'Eye:: Blink': ['眨眼'],
  'Leg:: Front:: Hip': ['前腳 髖'], 'Leg:: Front:: Knee': ['前腳 膝'], 'Leg:: Front:: Foot': ['前腳 腳踝'],
  'Leg:: Back:: Hip': ['後腳 髖'], 'Leg:: Back:: Knee': ['後腳 膝'], 'Leg:: Back:: Foot': ['後腳 腳踝'],
  'Arm:: Front:: Swing': ['前手 擺動'], 'Arm:: Front:: Elbow': ['前手 手肘'], 'Arm:: Back:: Swing': ['後手 擺動'],
  'Arm:: Back:: Elbow': ['後手 手肘'],
  'Body:: Angle X-Y': ['身體 左右轉', '身體 上下'], 'Eye:: Smile': ['笑眼 ^^'], 'Eye:: Wide': ['眼睛 睜大（− 瞇眼）'],
  'Brow:: Raise': ['眉毛 上揚'], 'Brow:: Angry': ['眉毛 生氣（− 難過）'], 'Mouth:: Form': ['嘴角 上揚（− 下垂）'],
  'Face:: Blush': ['臉紅'], 'Ear:: Twitch': ['耳朵 抖動'],
  'Arm:: Right:: Raise': ['右手 舉起（0 放下 → 1 揮手）'], 'Arm:: Chest': ['雙手 胸前合掌'], 'Arm:: Left:: Cheek': ['左手 托臉頰'],
  'Hand:: Right:: Wave': ['右手 揮動'], 'Hand:: Left:: Wave': ['左手 揮動'], 'Hand:: Left:: Wave Wrist': ['左手 揮動（手腕跟隨）'], 'Arm:: Left:: Eat': ['左手 吃胡蘿蔔（0 放下 → 1 咬）'], 'Mouth:: Chew': ['咀嚼（0 咬一口 / 0.5 拉開 / 1 嚼）'], 'Arm:: Left:: Eat Bob': ['咀嚼時手晃動'], 'Leg:: Right:: Step': ['右腳 抬起'], 'Leg:: Left:: Step': ['左腳 抬起'],
  'Leg:: Open': ['雙腿 開合（連動乳搖）'], 'Arm:: Right:: Bend': ['右臂 彎曲'], 'Arm:: Left:: Bend': ['左臂 彎曲'],
  'Prop:: Carrot:: Sway': ['胡蘿蔔 擺動'] };

// ---- which model: ?model=<id> (listed in models.json, shared with the gallery page)
const models = await (await fetch('./models.json', { cache: 'no-cache' })).json();
const wanted = new URLSearchParams(location.search).get('model');
const model = models.find((m) => m.id === wanted) || models[0];
const pick = document.getElementById('pick');
for (const m of models) pick.add(new Option(m.name, m.id, false, m.id === model.id));
pick.onchange = () => { location.search = '?model=' + pick.value; };

// 前後切換按鈕控制（對應畫面上「前」「後」按鈕）
const curIdx = models.findIndex((m) => m.id === model.id);
const prevModel = models[(curIdx - 1 + models.length) % models.length];
const nextModel = models[(curIdx + 1) % models.length];
const navPrev = document.getElementById('navPrev');
const navNext = document.getElementById('navNext');
function switchModel(delta) {
  const cIdx = models.findIndex((m) => m.id === model.id);
  const targetIdx = (cIdx + delta + models.length) % models.length;
  location.search = '?model=' + models[targetIdx].id;
}
if (navPrev) {
  navPrev.title = `切換至上一個角色（前）：${prevModel.name}`;
  navPrev.onclick = () => switchModel(-1);
}
if (navNext) {
  navNext.title = `切換至下一個角色（後）：${nextModel.name}`;
  navNext.onclick = () => switchModel(1);
}
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') switchModel(-1);
  else if (e.key === 'ArrowRight') switchModel(1);
});

document.getElementById('title').textContent = `${model.name} · Inochi2D`;
document.getElementById('sub').innerHTML = `${model.desc}<br>模型檔：<code>${model.file}</code>`;
document.title = `${model.name} · Inochi2D Demo`;

let puppet, gl, tex, side = null, view = { cx: 0, cy: 0, scale: 1 }, autoFit = true, isSide = false;
try {
  const data = await loadINP('./' + model.file);
  puppet = new Puppet(data);
  gl = new GL(canvas, { alpha: true });
  tex = data.textures.map((b) => gl.texture(b));
  if (model.side) {                        // profile partner for the natural-turn walk
    const d2 = await loadINP(`./models/${model.side}.inp`);
    const joints = await (await fetch(`./models/${model.side}.joints.json`)).json();
    side = { p: new Puppet(d2), tex: d2.textures.map((b) => gl.texture(b)), joints,
             Lt: joints['Shin F'][1] - joints['Thigh F'][1], Ls: joints['Foot F'][1] - joints['Shin F'][1] };
  }
  isSide = !!puppet.byName['Leg:: Front:: Hip'];
  for (const el of document.querySelectorAll('.side-only')) el.style.display = isSide ? '' : 'none';
  for (const el of document.querySelectorAll('.front-only')) el.style.display = isSide ? 'none' : '';
  if (model.noIdleArms) { document.getElementById('tArms').checked = false; document.getElementById('tArmsLab').style.display = 'none'; }   // 卡洛兒姐姐: wave only, no idle sway (user)
  for (const el of document.querySelectorAll('.eat-only')) el.style.display = puppet.byName['Arm:: Left:: Eat'] ? '' : 'none';
  for (const el of document.querySelectorAll('.raise-only')) el.style.display = puppet.byName['Arm:: Left:: Raise'] && !puppet.byName['Arm:: Chest'] ? '' : 'none';
  for (const el of document.querySelectorAll('.body-only')) el.style.display = puppet.byName['Body:: Angle X-Y'] ? '' : 'none';
  for (const el of document.querySelectorAll('.ear-only')) el.style.display = puppet.byName['Ear:: Twitch'] ? '' : 'none';
  for (const el of document.querySelectorAll('.expr-only')) el.style.display = puppet.byName['Eye:: Smile'] ? '' : 'none';
  for (const el of document.querySelectorAll('.gest-only')) el.style.display = puppet.byName['Arm:: Chest'] ? '' : 'none';
  status.textContent = `${puppet.parts.length} 個零件 · ${puppet.params.length} 個參數 · ${(data.bytes / 1024).toFixed(0)} KB`;
} catch (e) {
  status.textContent = '載入失敗：' + e.message + '（請用本機伺服器開啟，例如 python -m http.server）';
  throw e;
}

// ---- controls built from the puppet's own parameters
const box = document.getElementById('params'), sliders = [];
for (const p of puppet.params) {
  const axes = p.is_vec2 ? [0, 1] : [0];
  for (const ax of axes) {
    const lab = document.createElement('label'); lab.className = 'row';
    const name = (LABELS[p.name] || [p.name, p.name + ' Y'])[ax];
    lab.innerHTML = `<span>${name}</span><span class="v"></span><input type="range" step="0.01">`;
    const inp = lab.querySelector('input'), out = lab.querySelector('.v');
    inp.min = p.min[ax]; inp.max = p.max[ax]; inp.value = p.defaults[ax];
    inp.setAttribute('aria-label', name);
    inp.addEventListener('input', () => { p.value[ax] = +inp.value; manual.add(p.name); });
    sliders.push({ p, ax, inp, out });
    box.appendChild(lab);
  }
}
const manual = new Set();
document.getElementById('reset').onclick = () => { for (const p of puppet.params) p.value = [...p.defaults]; manual.clear(); };
const T = (id) => document.getElementById(id);
window.demo = { puppet, get side() { return side; }, view, manual, renderer: gl, noFit() { autoFit = false; }, get pointer() { return pointer; } };   // handy for scripted checks

// ---- camera: fit the figure, drag to pan, wheel to zoom
function resize() {
  const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  canvas.width = Math.max(1, r.width * dpr); canvas.height = Math.max(1, r.height * dpr);
  if (autoFit && document.body.classList.contains('full') && bust) {   // full view, upper-body close-up
    view.scale = Math.min(canvas.width / 620, canvas.height / 900);
    view.cx = 0; view.cy = -930 + (canvas.height * 0.46) / view.scale;   // the head's top near the top edge
  } else if (autoFit) {       // stand on the ground: feet (puppet y ~ +1000) sit on the ground line at the bottom
    const full = document.body.classList.contains('full');
    view.scale = Math.min(canvas.width / (isSide ? 1500 : full ? 960 : 1250), canvas.height / (full ? 2000 : 2080));
    view.cx = 0; view.cy = (FEET[model.id] ?? 1000) - (canvas.height * (0.5 - 0.035)) / view.scale;
  }
}
let bust = false;
addEventListener('resize', resize); resize();
// full view toggle (phones especially): hide the controls, the character fills the screen; tap again to go back
const zoomBtn = document.getElementById('zoom'), bustBtn = document.getElementById('bust');
bustBtn.onclick = () => { bust = !bust; bustBtn.textContent = bust ? '全身' : '半身'; autoFit = true; resize(); };
zoomBtn.onclick = async () => {
  const on = !document.body.classList.contains('full');
  document.body.classList.toggle('full', on);
  zoomBtn.textContent = on ? '✕ 返回' : '⛶ 放大'; zoomBtn.setAttribute('aria-pressed', on);
  bustBtn.style.display = on ? '' : 'none'; if (!on) { bust = false; bustBtn.textContent = '半身'; }
  try { if (on && document.documentElement.requestFullscreen && matchMedia('(max-width: 760px)').matches) await document.documentElement.requestFullscreen(); else if (!on && document.fullscreenElement) await document.exitFullscreen(); } catch (_) {}
  autoFit = true; requestAnimationFrame(resize);
};
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('full') && matchMedia('(max-width: 760px)').matches) zoomBtn.click(); });
let drag = null, pointer = { x: 0, y: -0.3 };
const aim = (e) => {                                // pointer -> -1..1 in the character pane (gaze target)
  const r = canvas.getBoundingClientRect();
  pointer = { x: ((e.clientX - r.left) / r.width) * 2 - 1, y: ((e.clientY - r.top) / r.height) * 2 - 1 };
};
canvas.addEventListener('pointerdown', (e) => {
  aim(e);                                           // a tap turns the gaze right away, like hovering with a mouse
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}   // keep following if the finger slides off the pane
  if (e.pointerType !== 'mouse') return;            // touch: the finger only steers the gaze, never moves the character
  drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy };
});
canvas.addEventListener('dblclick', () => { autoFit = true; resize(); });
canvas.addEventListener('pointerup', () => (drag = null));
canvas.addEventListener('pointermove', (e) => {
  aim(e);
  if (drag) { autoFit = false; const d = devicePixelRatio || 1;
    view.cx = drag.cx - ((e.clientX - drag.x) * d) / view.scale; view.cy = drag.cy - ((e.clientY - drag.y) * d) / view.scale; }
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); autoFit = false; view.scale *= Math.exp(-e.deltaY * 0.0015); }, { passive: false });

// ---- animation loop
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pv = (name, ax = 0) => puppet.byName[name]?.value[ax] ?? 0;      // side models lack some front params
function spring(s, target, dt, k, c) { const acc = k * k * (target - s.x) - 2 * c * s.v; s.v += acc * dt; s.x += s.v * dt; }
const mk = () => ({ x: 0, v: 0 });

<style>

  * { box-sizing: border-box; }

  nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }

  .lock-btn:hover { border-color: var(--accent); color: var(--ink); }

  /* 鎖定認證畫面 */
  .auth-overlay {
    position: fixed; inset: 0; z-index: 100;

  label.row span.v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }

function b64ToBuf(b64) {
  const str = atob(b64);
  const buf = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) buf[i] = str.charCodeAt(i);
  return buf;
}

async function verifyAndDecrypt(pass) {
  const enc = new TextEncoder();
  // 1. 驗證加鹽 Hash
  const hashBuf = await crypto.subtle.digest('SHA-256', enc.encode(SEC_PAYLOAD.verifySalt + pass));
  const hashHex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
  if (hashHex !== SEC_PAYLOAD.passwordHash) {
    throw new Error('密碼錯誤');
  }

  // 2. PBKDF2 衍生 AES-256 金鑰
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pass), { name: 'PBKDF2' }, false, ['deriveKey']);
  const saltBuf = b64ToBuf(SEC_PAYLOAD.encSalt);
  const aesKey = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBuf, iterations: 100000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );

  // 3. AES-GCM 解密模型清單
  const ivBuf = b64ToBuf(SEC_PAYLOAD.iv);
  const cipherBuf = b64ToBuf(SEC_PAYLOAD.ciphertext);
  const tagBuf = b64ToBuf(SEC_PAYLOAD.tag);
  const combined = new Uint8Array(cipherBuf.length + tagBuf.length);
  combined.set(cipherBuf);
  combined.set(tagBuf, cipherBuf.length);

  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: ivBuf },
    aesKey,
    combined
  );
  const models = JSON.parse(new TextDecoder().decode(decrypted));
  // 注入最新 NIKKE 蒂亞・海岸甜心 專屬限定角色
  if (!models.some(m => m.id === 'nikke_tia')) {
    models.unshift({
      id: 'nikke_tia',
      name: '蒂亞・海岸甜心',
      file: 'models/nikke_tia.inp',
      thumb: 'thumbs/nikke_tia.png',
      desc: '《勝利女神：妮姬》人氣角色蒂亞（Tia）夏季限定時裝「海岸甜心」：甜美笑容、金髮與墨鏡、手持水果聖代與湯匙、純白珍珠比基尼、半透薄紗裙。九軸轉頭 ±30°、眨眼閉眼、張嘴說話、呼吸、長髮與手臂擺動、專屬乳搖物理互動。'
    });
  }
  return models;
}

// -------------------------------------------------------------
// UI 狀態控制
// -------------------------------------------------------------
const authOverlay = document.getElementById('authOverlay');
const authCard = document.getElementById('authCard');
const passInput = document.getElementById('passInput');
const authMsg = document.getElementById('authMsg');
const btnUnlock = document.getElementById('btnUnlock');
const toggleEye = document.getElementById('toggleEye');
const mainWrap = document.getElementById('mainWrap');
const lockBtn = document.getElementById('lockBtn');

toggleEye.onclick = () => {
  passInput.type = passInput.type === 'password' ? 'text' : 'password';
  toggleEye.textContent = passInput.type === 'password' ? '👁️' : '🔒';
};

lockBtn.onclick = () => {
  sessionStorage.removeItem('inochi_secret_pass');
  location.reload();
};

document.getElementById('authForm').addEventListener('submit', (e) => {
  e.preventDefault();
  handleUnlock();
});

async function handleUnlock() {
  const val = passInput.value.trim();
  if (!val) return;
  authMsg.textContent = '驗證解密中…';
  authMsg.style.color = 'var(--muted)';
  btnUnlock.disabled = true;

  try {
    const models = await verifyAndDecrypt(val);
    sessionStorage.setItem('inochi_secret_pass', val);
    authOverlay.style.display = 'none';
    mainWrap.style.visibility = 'visible';
    startPlayer(models);
  } catch (err) {
    authCard.classList.remove('shake');
    void authCard.offsetWidth; // trigger reflow
    authCard.classList.add('shake');
    authMsg.textContent = '❌ 通行密碼不正確，請重新確認';
    authMsg.style.color = '#ff6b6b';
    btnUnlock.disabled = false;
    passInput.focus();
    passInput.select();
  }
};

// 若當前 session 已解鎖過，直接解密進入
const cachedPass = sessionStorage.getItem('inochi_secret_pass');
if (cachedPass) {
  verifyAndDecrypt(cachedPass).then((models) => {
    authOverlay.style.display = 'none';
    mainWrap.style.visibility = 'visible';
    startPlayer(models);
  }).catch(() => {
    sessionStorage.removeItem('inochi_secret_pass');
  });
}

  'Tail:: Sway': ['兔尾 擺動'], 'Ear:: Twitch': ['兔耳 晃動'],
  'Chest:: Sway X': ['胸部 左右晃'], 'Chest:: Bounce Y': ['胸部 上下彈'], 'Chest:: Squash': ['胸部 寬窄'],
  'Body:: Angle X-Y': ['身體 左右轉', '身體 上下'], 'Eye:: Smile': ['笑眼 ^^'], 'Eye:: Wide': ['眼睛 睜大（− 瞇眼）'],
  'Brow:: Raise': ['眉毛 上揚'], 'Brow:: Angry': ['眉毛 生氣（− 難過）'], 'Mouth:: Form': ['嘴角 上揚（− 下垂）'],
  'Face:: Blush': ['臉紅'],
  'Arm:: Right:: Raise': ['右手 舉起（揮手）'], 'Arm:: Chest': ['雙手 胸前合掌'], 'Arm:: Left:: Cheek': ['左手 托臉頰'],
  'Leg:: Right:: Step': ['右腳 踏步'], 'Leg:: Left:: Step': ['左腳 踏步']
};

function startPlayer(models) {
  const wanted = new URLSearchParams(location.search).get('model');
  const model = models.find((m) => m.id === wanted) || models[0];
  const pick = document.getElementById('pick');
  pick.innerHTML = '';
  for (const m of models) pick.add(new Option(m.name, m.id, false, m.id === model.id));
  pick.onchange = () => { location.search = '?model=' + pick.value; };

  document.getElementById('title').textContent = `${model.name} · 專屬限定展示`;
  document.getElementById('sub').innerHTML = `${model.desc}<br>檔案：<code>${model.file}</code>`;
  document.title = `${model.name} · 專屬限定 Inochi2D`;

  let puppet, gl, tex, view = { cx: 0, cy: 0, scale: 1 }, autoFit = true;

  (async () => {
    try {
      status.textContent = '載入專屬模型中…';
      const data = await loadINP('./' + model.file);
      puppet = new Puppet(data);
      gl = new GL(canvas, { alpha: true });
      tex = data.textures.map((b) => gl.texture(b));
      initControls(puppet, model);
      buildParams(puppet);
      status.textContent = '';
      requestAnimationFrame(loop);
    } catch (e) {
      status.textContent = '載入失敗：' + e.message;
      console.error(e);
    }
  })();

  function initControls(puppet, model) {
    const hasExpr = (puppet.has ? puppet.has('Eye:: Smile') : !!puppet.byName['Eye:: Smile']) ||
                    (puppet.has ? puppet.has('Face:: Blush') : !!puppet.byName['Face:: Blush']);
    const hasGest = (puppet.has ? puppet.has('Arm:: Right:: Raise') : !!puppet.byName['Arm:: Right:: Raise']) ||
                    (puppet.has ? puppet.has('Arm:: Chest') : !!puppet.byName['Arm:: Chest']);
    const hasChest = (puppet.has ? puppet.has('Chest:: Sway X') : !!puppet.byName['Chest:: Sway X']) ||
                     (puppet.has ? puppet.has('Chest:: Bounce Y') : !!puppet.byName['Chest:: Bounce Y']);
    const hasStep = (puppet.has ? puppet.has('Leg:: Right:: Step') : !!puppet.byName['Leg:: Right:: Step']);

    const exprBox = document.querySelector('.expr-only');
    if (exprBox) exprBox.style.display = hasExpr ? '' : 'none';
    const gestBox = document.querySelector('.gest-only');
    if (gestBox) gestBox.style.display = hasGest ? '' : 'none';
    const jBox = document.querySelector('.jiggle-box');
    if (jBox) jBox.style.display = hasChest ? '' : 'none';
    const sEl = document.querySelector('.step-only');
    if (sEl) sEl.style.display = hasStep ? '' : 'none';

    // 表情切換按鈕
    if (hasExpr) {
      const EXPRS = [
        { name: '平常', apply: {} },
        { name: '開心 😊', apply: { 'Eye:: Smile': 1, 'Mouth:: Form': 0.8, 'Face:: Blush': 0.3 } },
        { name: '害羞 😳', apply: { 'Face:: Blush': 1, 'Mouth:: Form': -0.3, 'Eye:: Smile': 0.4 } },
        { name: '驚訝 😮', apply: { 'Eye:: Wide': 1, 'Brow:: Raise': 1, 'Mouth:: Open': 0.8 } },
        { name: '生氣 😠', apply: { 'Brow:: Angry': 1, 'Mouth:: Form': -1 } },
        { name: '難過 🥺', apply: { 'Brow:: Angry': -1, 'Mouth:: Form': -0.8 } }
      ];
      const div = document.getElementById('exprs');
      div.innerHTML = '';
      EXPRS.forEach((ex, i) => {
        const b = document.createElement('button');
        b.textContent = ex.name;
        b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
        b.onclick = () => {
          div.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
          b.setAttribute('aria-pressed', 'true');
          ['Eye:: Smile', 'Face:: Blush', 'Mouth:: Form', 'Eye:: Wide', 'Brow:: Raise', 'Brow:: Angry'].forEach((k) => puppet.set(k, 0));
          for (const [k, v] of Object.entries(ex.apply)) puppet.set(k, v);
          syncSliders();
        };
        div.appendChild(b);
      });
    }

    // 手勢按鈕
    if (hasGest) {
      const GESTS = [
        { name: '放下手', apply: { 'Arm:: Right:: Raise': 0, 'Arm:: Chest': 0, 'Arm:: Left:: Cheek': 0 } },
        { name: '揮手 👋', apply: { 'Arm:: Right:: Raise': 1, 'Arm:: Chest': 0, 'Arm:: Left:: Cheek': 0 } },
        { name: '胸前合掌 🙏', apply: { 'Arm:: Chest': 1, 'Arm:: Right:: Raise': 0, 'Arm:: Left:: Cheek': 0 } },
        { name: '托腮 🥰', apply: { 'Arm:: Left:: Cheek': 1, 'Arm:: Right:: Raise': 0, 'Arm:: Chest': 0 } }
      ];
      const div = document.getElementById('gests');
      div.innerHTML = '';
      GESTS.forEach((g, i) => {
        const b = document.createElement('button');
        b.textContent = g.name;
        b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
        b.onclick = () => {
          div.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
          b.setAttribute('aria-pressed', 'true');
          for (const [k, v] of Object.entries(g.apply)) puppet.set(k, v);
          syncSliders();
        };
        div.appendChild(b);
      });
    }

    document.getElementById('reset').onclick = () => {
      puppet.params.forEach((p) => {
        p.value[0] = p.defaults[0];
        if (p.is_vec2) p.value[1] = p.defaults[1];
      });
      syncSliders();
    };

    // 縮放按鈕
    document.getElementById('zoom').onclick = () => {
      document.body.classList.toggle('full');
      autoFit = true;
    };
  }

  function buildParams(puppet) {
    const box = document.getElementById('params');
    box.innerHTML = '';
    for (const p of puppet.params) {
      const is2D = p.is_vec2 || p.value.length === 2;
      const names = LABELS[p.name] || (is2D ? [p.name + ' X', p.name + ' Y'] : [p.name]);
      for (let axis = 0; axis < p.value.length; axis++) {
        const id = `p_${p.name}_${axis}`.replace(/\W+/g, '_');
        const min = p.min[axis], max = p.max[axis];
        const row = document.createElement('label');
        row.className = 'row';
        row.innerHTML = `<span>${names[axis] || p.name}</span><span class="v" id="${id}_v">0.00</span>
          <input type="range" id="${id}" min="${min}" max="${max}" step="${(max - min) / 200}" value="${p.value[axis]}">`;
        box.appendChild(row);
        const input = row.querySelector('input');
        input.oninput = () => {
          p.value[axis] = parseFloat(input.value);
          row.querySelector('.v').textContent = p.value[axis].toFixed(2);
        };
      }
    }
  }

  function syncSliders() {
    for (const p of puppet.params) {
      for (let axis = 0; axis < p.value.length; axis++) {
        const id = `p_${p.name}_${axis}`.replace(/\W+/g, '_');
        const input = document.getElementById(id);
        const val = document.getElementById(id + '_v');
        if (input) { input.value = p.value[axis]; }
        if (val) { val.textContent = Number(p.value[axis]).toFixed(2); }
      }
    }
  }

  // -------------------------------------------------------------
  // 💖 乳搖物理引擎 (Spring-Damper Physics with Inertia & Jiggle)
  // -------------------------------------------------------------
  const jiggle = {
    x: 0, vx: 0,
    y: 0, vy: 0,
    k: 160,     // 彈力係數 (stiffness)
    d: 9.5,     // 阻尼衰減 (damping)
    lastX: 0, lastY: 0, lastT: performance.now(),
    isDown: false,
    downX: 0, downY: 0
  };

  const forceInput = document.getElementById('jiggleForce');
  const forceVal = document.getElementById('jiggleForceVal');
  let jiggleMultiplier = 1.2;
  if (forceInput) {
    forceInput.oninput = () => {
      jiggleMultiplier = parseFloat(forceInput.value);
      if (forceVal) forceVal.textContent = jiggleMultiplier.toFixed(1) + 'x';
    };
  }

  // 測試按鈕事件
  const pokeBtn = document.getElementById('btnJigglePoke');
  if (pokeBtn) {
    pokeBtn.onclick = () => {
      jiggle.vy += 1.0 * jiggleMultiplier;
      jiggle.vx += (Math.random() - 0.5) * 0.8 * jiggleMultiplier;
    };
  }
  const bounceBtn = document.getElementById('btnJiggleBounce');
  if (bounceBtn) {
    bounceBtn.onclick = () => {
      jiggle.vy += 1.9 * jiggleMultiplier;
    };
  }
  const waveBtn = document.getElementById('btnJiggleWave');
  if (waveBtn) {
    waveBtn.onclick = () => {
      jiggle.vx += (Math.random() > 0.5 ? 1.6 : -1.6) * jiggleMultiplier;
      jiggle.vy += -1.3 * jiggleMultiplier;
    };
  }

  // 滑鼠 / 觸控互動：上下左右移動慣性 + 點擊彈跳 + 拖曳回彈 + 視角平移縮放
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    jiggle.isDown = true;
    jiggle.downX = e.clientX;
    jiggle.downY = e.clientY;
    if (e.pointerType === 'mouse' && e.button === 0) {
      drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy };
    }
    // 點擊觸發立即 Q 彈
    if (document.getElementById('tJiggle')?.checked) {
      jiggle.vy += 0.9 * jiggleMultiplier;
      jiggle.vx += (Math.random() - 0.5) * 0.6 * jiggleMultiplier;
    }
  });

  window.addEventListener('pointerup', (e) => {
    if (jiggle.isDown && document.getElementById('tJiggle')?.checked) {
      const dx = e.clientX - jiggle.downX;
      const dy = e.clientY - jiggle.downY;
      if (Math.hypot(dx, dy) > 8) {
        jiggle.vx += (-dx * 0.025) * jiggleMultiplier;
        jiggle.vy += (-dy * 0.035) * jiggleMultiplier;
      }
    }
    jiggle.isDown = false;
    drag = null;
  });

  canvas.addEventListener('dblclick', () => { autoFit = true; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    autoFit = false;
    view.scale = Math.min(5, Math.max(0.1, view.scale * (e.deltaY < 0 ? 1.1 : 0.9)));
  }, { passive: false });

  // 視角控制與滑鼠慣性跟隨
  let targetLook = { x: 0, y: 0 }, curLook = { x: 0, y: 0 };
  window.addEventListener('pointermove', (e) => {
    const now = performance.now();
    const dt = Math.max((now - jiggle.lastT) / 1000, 0.001);
    const dx = e.clientX - jiggle.lastX;
    const dy = e.clientY - jiggle.lastY;
    jiggle.lastX = e.clientX;
    jiggle.lastY = e.clientY;
    jiggle.lastT = now;

    if (drag) {
      autoFit = false;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      view.cx = drag.cx - ((e.clientX - drag.x) * dpr) / view.scale;
      view.cy = drag.cy - ((e.clientY - drag.y) * dpr) / view.scale;
    }

    const r = canvas.getBoundingClientRect();
    targetLook.x = ((e.clientX - r.left) / r.width - 0.5) * 2;
    targetLook.y = ((e.clientY - r.top) / r.height - 0.5) * -2;

    // 滑鼠上下左右移動觸發慣性乳搖！
    if (document.getElementById('tJiggle')?.checked && dt < 0.1) {
      const spdX = dx / dt;
      const spdY = dy / dt;
      jiggle.vx += (spdX * 0.00055) * jiggleMultiplier;
      jiggle.vy += (spdY * 0.00075) * jiggleMultiplier;
    }
  });

  // 主渲染循環
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    const t = now / 1000;

    // 視線平滑
    curLook.x += (targetLook.x - curLook.x) * Math.min(dt * 8, 1);
    curLook.y += (targetLook.y - curLook.y) * Math.min(dt * 8, 1);

    if (document.getElementById('tLook').checked) {
      puppet.set('Head:: Yaw-Pitch', curLook.x * 0.8, curLook.y * 0.6);
      if (document.getElementById('tBody').checked) {
        puppet.set('Body:: Angle X-Y', curLook.x * 0.4, curLook.y * 0.3);
      }
    }

    if (document.getElementById('tBreath').checked) {
      puppet.set('Body:: Breath', Math.sin(t * 2.2) * 0.5 + 0.5);
    }

    if (document.getElementById('tBlink').checked) {
      const blink = Math.sin(t * 1.5) > 0.96 ? 1 : 0;
      puppet.set('Eye:: Left:: Blink', blink);
      puppet.set('Eye:: Right:: Blink', blink);
    }

    if (document.getElementById('tPhys').checked) {
      const sway = Math.sin(t * 3.5) * 0.25;
      puppet.set('Hair:: Sway', sway);
      puppet.set('Ear:: Twitch', Math.sin(t * 4.0) * 0.3);
      puppet.set('Tail:: Sway', Math.cos(t * 3.0) * 0.4);
    }

    if (document.getElementById('tArms').checked) {
      puppet.set('Arm:: Right:: Swing', Math.sin(t * 2.5) * 0.2);
      puppet.set('Arm:: Left:: Swing', Math.cos(t * 2.5) * 0.2);
    }

    // 💖 乳搖彈簧物理計算與套用
    if (document.getElementById('tJiggle')?.checked) {
      const fx = -jiggle.k * jiggle.x - jiggle.d * jiggle.vx;
      const fy = -jiggle.k * jiggle.y - jiggle.d * jiggle.vy;
      jiggle.vx += fx * dt;
      jiggle.vy += fy * dt;
      jiggle.x += jiggle.vx * dt;
      jiggle.y += jiggle.vy * dt;

      const breathSway = Math.sin(t * 3.0) * 0.08;
      const breathBounce = Math.abs(Math.sin(t * 3.5)) * 0.12;

      const swayVal = Math.min(1, Math.max(-1, jiggle.x + breathSway));
      const bounceVal = Math.min(1, Math.max(-1, jiggle.y + breathBounce));
      const squashVal = Math.min(1, Math.max(-1, -bounceVal * 0.55));

      puppet.set('Chest:: Sway X', swayVal);
      puppet.set('Chest:: Bounce Y', bounceVal);
      puppet.set('Chest:: Squash', squashVal);
    }

    if (document.getElementById('tStep') && document.getElementById('tStep').checked) {
      puppet.set('Leg:: Right:: Step', Math.max(0, Math.sin(t * 4)));
      puppet.set('Leg:: Left:: Step', Math.max(0, -Math.sin(t * 4)));
    }

    if (document.getElementById('tTalk').checked) {
      puppet.set('Mouth:: Open', (Math.sin(t * 8) * 0.5 + 0.5) * (Math.sin(t * 2) > 0 ? 1 : 0.2));
    }

    puppet.update();

    // 視窗自適應
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const r = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width * dpr));
    const h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      autoFit = true;
    }

    if (autoFit) {
      const full = document.body.classList.contains('full');
      view.scale = Math.min(canvas.width / (full ? 960 : 1250), canvas.height / (full ? 2000 : 2080));
      view.cx = 0;
      view.cy = 1000 - (canvas.height * (0.5 - 0.035)) / view.scale;
      autoFit = false;
    }

    const k = view.scale;
    const ox = canvas.width / 2 - view.cx * k;
    const oy = canvas.height / 2 - view.cy * k;
    gl.begin([0, 0, 0, 0]);
    gl.puppet(puppet, tex, k, ox, oy);

    requestAnimationFrame(loop);
  }
}
</script>
</body>
</html>

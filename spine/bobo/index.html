<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兔子波波 · Spine</title>
<link rel="stylesheet" href="spine-player.css">
<style>
  :root { --bg:#12151d; --panel:#1b2030; --line:#2a3145; --text:#e8ebf2; --muted:#8e97ad; --accent:#ff8a2a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 32px; }
  h1 { margin:0 0 4px; font-size:22px; font-weight:700; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .stage { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:16px; }
  @media (max-width:820px){ .stage { grid-template-columns:1fr; } }
  #player { height:min(78vh,820px); min-height:420px; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#171c28; }
  .side { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:14px; }
  .label { font-size:12px; color:var(--muted); letter-spacing:.06em; margin-bottom:6px; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  button { font:inherit; font-size:14px; color:var(--text); background:#252c40; border:1px solid var(--line); border-radius:8px; padding:9px 8px; cursor:pointer; text-align:left; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#1a1205; font-weight:700; }
  button small { display:block; font-size:11px; opacity:.75; font-weight:400; }
  .row { display:flex; align-items:center; gap:8px; font-size:13px; }
  .row input[type=range] { flex:1; accent-color:var(--accent); }
  .note { font-size:12px; color:var(--muted); line-height:1.6; }
  .note b { color:var(--text); font-weight:600; }
</style>
</head>
<body>
<a href="../" style="position:fixed;top:10px;right:12px;z-index:20;font:13px system-ui,'Microsoft JhengHei',sans-serif;color:#ffb37a;background:rgba(20,22,32,.75);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;text-decoration:none">← Spine 動畫</a>
<div class="wrap">
  <h1>🐰 兔子波波 <span>Bobo</span> · Spine 2D</h1>
  <div class="sub">由 bobo.psd 建置 · 27 個網格部件全部骨骼蒙皮 · 九軸轉頭 ±15° · 耳朵／頭頂毛／胡蘿蔔葉／領巾彈簧物理烘焙</div>
  <div class="stage">
    <div id="player"></div>
    <div class="side">
      <div>
        <div class="label">動作</div>
        <div class="btns" id="anims"></div>
      </div>
      <div>
        <div class="label">播放</div>
        <div class="row">速度 <input type="range" id="speed" min="0.1" max="1.5" step="0.05" value="1"><span id="speedv">1.0×</span></div>
        <div class="row" style="margin-top:8px"><label><input type="checkbox" id="bones"> 顯示骨架</label></div>
      </div>
      <div class="note">
        <b>拖曳</b>平移、<b>滾輪</b>縮放。<br>
        骨架：26 根骨頭（兩隻耳朵、頭頂毛、胡蘿蔔葉各 2 節，領巾尾巴 1 節）。抱胡蘿蔔（胡蘿蔔、葉子、雙手一起動）和空手是兩套原畫，瞬間切換；
        拍桌、舉手、揮手時放下胡蘿蔔，改用空手。
      </div>
    </div>
  </div>
</div>
<script src="spine-player.js"></script>
<script>
const ANIMS = [
  ['idle', '待機', '抱著胡蘿蔔晃'], ['talk', '說話', '啊／喔 口型'], ['slam', '拍桌搶答', '空手拍兩下'],
  ['raise_paw', '舉手搶答', '舉手跳跳'], ['shy', '心虛', '耳朵垂、眼神飄'], ['happy', '開心跳跳', '笑眼、耳朵甩'],
  ['wave', '揮手', '空手揮'], ['surprise', '嚇一跳', '耳朵豎、張大眼'], ['nod', '點頭', '嗯嗯'],
];
let player = null;
const box = document.getElementById('anims');
for (const [id, zh, hint] of ANIMS) {
  const b = document.createElement('button');
  b.id = 'btn-' + id;
  b.innerHTML = zh + '<small>' + hint + '</small>';
  b.onclick = () => play(id);
  box.appendChild(b);
}
function play(id) {
  if (!player || !player.animationState) return;
  player.animationState.setAnimation(0, id, true);
  document.querySelectorAll('#anims button').forEach(b => b.classList.toggle('on', b.id === 'btn-' + id));
}
player = new spine.SpinePlayer('player', {
  jsonUrl: 'bobo.json',
  atlasUrl: 'bobo.atlas',
  animation: 'idle',
  premultipliedAlpha: true,
  backgroundColor: '#171c28',
  showControls: false,
  defaultMix: 0.25,
  viewport: { x: -620, y: -20, width: 1240, height: 1960, padLeft: '4%', padRight: '4%', padTop: '3%', padBottom: '3%', transitionTime: 0 },
  success: p => { document.getElementById('btn-idle').classList.add('on'); },
  error: (p, msg) => {
    const hint = location.protocol === 'file:' ? '（請用 start_preview.bat 開啟，瀏覽器不允許 file:// 讀取模型）' : '';
    document.getElementById('player').innerHTML = '<p style="padding:24px;color:#ff9b6b">載入失敗：' + msg + hint + '</p>';
  }
});
document.getElementById('speed').oninput = e => {
  const v = parseFloat(e.target.value);
  document.getElementById('speedv').textContent = v.toFixed(2).replace(/0$/, '') + '×';
  if (player && player.animationState) player.animationState.timeScale = v;
};
document.getElementById('bones').onchange = e => {
  if (player) { player.config.debug = player.config.debug || {}; player.config.debug.bones = e.target.checked; }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥕 Q版卡洛特 (Mr. Carrot Chibi) - Spine 2D 互動預覽器</title>
    <link rel="stylesheet" href="spine-player.css">
    <style>
        :root {
            --bg-color: #181a20;
            --panel-bg: #232730;
            --accent: #f28b24;
            --accent-hover: #fa9d3f;
            --text-main: #f0f3f8;
            --text-sub: #9ca3af;
            --border: #333946;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header p {
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 6px;
        }
        .stage-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.4);
            overflow: hidden;
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
        }
        #player-container {
            width: 100%;
            height: 560px;
            background: radial-gradient(circle at center, #2e3442 0%, #1c202a 100%);
            position: relative;
        }
        .controls-bar {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #1e222b;
        }
        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: #2d3341;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: #394152;
            border-color: var(--accent);
        }
        .btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(242, 139, 36, 0.4);
        }
        .meta-info {
            font-size: 13px;
            color: var(--text-sub);
            display: flex;
            gap: 16px;
        }
        .badge {
            background: rgba(242, 139, 36, 0.15);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .footer-tips {
            margin-top: 16px;
            color: var(--text-sub);
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<a href="../" style="position:fixed;top:10px;right:12px;z-index:20;font:13px system-ui,'Microsoft JhengHei',sans-serif;color:#ffb37a;background:rgba(20,22,32,.75);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;text-decoration:none">← Spine 動畫</a>

    <div class="header">
        <h1><span>🥕</span> Q版卡洛特先生 (Mr. Carrot Chibi) - Spine 2D</h1>
        <p>正統階層骨骼動畫 (Spine 4.1) ｜ 33 圖層完美差分 ｜ 官方 Spine Web Player 即時渲染</p>
    </div>

    <div class="stage-card">
        <div id="player-container"></div>
        <div class="controls-bar">
            <div class="btn-group">
                <button class="btn active" id="btn-idle" onclick="setAnim('idle')">🌸 待機 (Idle)</button>
                <button class="btn" id="btn-wave" onclick="setAnim('wave')">👋 揮手 (Wave)</button>
                <button class="btn" id="btn-jump" onclick="setAnim('jump')">🦘 彈跳 (Jump)</button>
                <button class="btn" id="btn-walk" onclick="setAnim('walk')">🚶 邁步 (Walk)</button>
            </div>
            <div class="meta-info">
                <span>骨骼數: <strong style="color:var(--text-main);">32</strong></span>
                <span>圖層插槽: <strong style="color:var(--text-main);">33</strong></span>
                <span class="badge">Spine 4.1.24</span>
            </div>
        </div>
    </div>

    <div class="footer-tips">
        💡 <strong>提示：</strong>可使用滑鼠在畫布內拖曳旋轉視角、滾輪縮放。點擊上方按鈕即可無縫切換骨骼動畫！<br>
        專案相容 Spine Editor (4.1+)、Unity Spine-Runtime 及各主流遊戲引擎。
    </div>

    <script src="spine-player.js"></script>
    <script>
        let player = null;

        window.addEventListener('DOMContentLoaded', () => {
            player = new spine.SpinePlayer("player-container", {
                jsonUrl: "mr_carrot_chibi.json",
                atlasUrl: "mr_carrot_chibi.atlas",
                animation: "idle",
                premultipliedAlpha: false,
                backgroundColor: "#202531",
                alpha: false,
                showControls: true,
                defaultMix: 0.3,
                viewport: {
                    x: -450,
                    y: 0,
                    width: 900,
                    height: 1350,
                    padLeft: "10%",
                    padRight: "10%",
                    padTop: "10%",
                    padBottom: "10%"
                },
                success: function(p) {
                    console.log("Spine 2D Mr. Carrot Loaded Successfully!");
                },
                error: function(p, msg) {
                    console.error("Spine load error:", msg);
                }
            });
        });

        function setAnim(name) {
            if (!player || !player.animationState) return;
            player.animationState.setAnimation(0, name, true);
            
            document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-' + name);
            if (btn) btn.classList.add('active');
        }
    </script>
</body>
</html>
